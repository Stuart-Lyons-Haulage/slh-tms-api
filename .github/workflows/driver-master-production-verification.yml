name: Driver Master Production Verification

on:
  workflow_run:
    workflows: ["CD - Deploy TMS to Azure Container Apps"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: driver-master-production-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      API_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
    steps:
      - name: Wait for canonical TachoMaster driver cleanse
        run: |
          set -euo pipefail
          deployed_at="${{ github.event.workflow_run.updated_at }}"
          deployed_epoch="$(date -u -d "$deployed_at" +%s)"
          echo "Requiring canonical Driver Master promotion at/after deployment completion: $deployed_at"
          for attempt in {1..60}; do
            body="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "https://$API_FQDN/api/v1/health/driver-master" || true)"
            echo "Driver Master health attempt $attempt: $body"
            canonical_at="$(echo "$body" | jq -r '.latestCanonicalSyncUtc // empty' 2>/dev/null || true)"
            canonical_epoch=0
            if test -n "$canonical_at"; then
              canonical_epoch="$(date -u -d "$canonical_at" +%s 2>/dev/null || echo 0)"
            fi
            # Pass conditions:
            #   1. No duplicate member codes (would break correlation uniqueness)
            #   2. No duplicate card numbers
            #   3. At least one active driver exists
            #   4. A canonical sync ran AFTER this deployment
            # populationAligned (TMS count == TachoMaster count) is reported but not
            # a hard gate — agency/casual drivers may exist in TMS but not TachoMaster.
            if test -n "$body" && \
               test "$(echo "$body" | jq -r '.duplicateMemberGroups // -1')" = "0" && \
               test "$(echo "$body" | jq -r '.duplicateCardGroups // -1')" = "0" && \
               test "$(echo "$body" | jq -r '.activeDrivers // 0')" -gt 0 && \
               test "$canonical_epoch" -ge "$deployed_epoch"; then
              echo "Canonical Driver Master is healthy (no duplicate identities, active drivers present, sync post-deployment)."
              echo "populationAligned=$(echo "$body" | jq -r '.populationAligned // false') activeWithoutMember=$(echo "$body" | jq -r '.activeWithoutMember // -1') (informational — agency drivers may not appear in TachoMaster)"
              exit 0
            fi
            sleep 10
          done
          echo "Canonical Driver Master did not produce a post-deployment canonical sync with zero duplicate identities within 10 minutes of deployment."
          exit 1

      - name: Summarise live Driver Master quality
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "https://$API_FQDN/api/v1/health/driver-master")"
          echo "$body" | jq '{status, activeDrivers, sourceWorkers, populationAligned, activeWithMember, activeWithCard, duplicateMemberGroups, duplicateCardGroups, activeWithoutMember, activeWithoutCard, latestCanonicalSyncUtc}'

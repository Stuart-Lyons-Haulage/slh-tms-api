name: CD - Deploy TMS to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image in Azure Container Registry
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            --image slh-tms-api:${{ github.sha }} \
            --image slh-tms-api:latest \
            .

      - name: Deploy image and configure ingress
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io/slh-tms-api:${{ github.sha }}

          az containerapp ingress update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --target-port 8080

      - name: Check health endpoint
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://${{ secrets.AZURE_CONTAINER_APP_FQDN }}/api/v1/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

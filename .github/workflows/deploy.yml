name: CD - Deploy TMS to Azure Container Apps

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: slh-tms-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CONTAINER_REGISTRY: slhtmsacrprod
      AZURE_CONTAINER_APP_NAME: slh-tms-api-prod
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      AZURE_CONTAINER_APP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push tested container image
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "slh-tms-api:$DEPLOY_SHA" \
            --image slh-tms-api:latest \
            .

      - name: Wait for Container App readiness
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            state="$(timeout 20s az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.provisioningState \
              --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then exit 0; fi
            echo "Container App provisioning state is ${state:-unknown}; waiting ($attempt/60)..."
            sleep 10
          done
          exit 1

      - name: Deploy image with stable runtime configuration
        run: |
          set -euo pipefail
          env_vars=(
            "ConnectionStrings__TmsDb=secretref:tms-db-connection"
            "Tracking__Dot__Enabled=true"
            "Tracking__Dot__BaseUrl=secretref:dot-base-url"
            "Tracking__Dot__ApiKey=secretref:dot-api-key"
            "Tracking__Dot__CompanyCode=secretref:dot-company-code"
            "Tracking__Dot__Username=secretref:dot-username"
            "Tracking__Dot__Password=secretref:dot-password"
            "Tracking__Dot__PollIntervalMinutes=1"
            "Tracking__Dot__RecoveryIntervalMinutes=60"
            "Maps__Endpoint=https://atlas.microsoft.com"
            "Maps__ClientId=58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c"
            "Integrations__TachoMaster__Enabled=true"
            "Integrations__TachoMaster__BaseUrl=secretref:dot-base-url"
            "Integrations__TachoMaster__ApiKey=secretref:dot-api-key"
            "Integrations__TachoMaster__Username=secretref:dot-username"
            "Integrations__TachoMaster__Password=secretref:dot-password"
            "Integrations__SageHr__Enabled=true"
            "Integrations__SageHr__BaseUrl=secretref:sagehr-base-url"
            "Integrations__SageHr__ApiKey=secretref:sagehr-api-key"
            "Integrations__SageHr__DriverTeamName=Drivers"
            "Integrations__SageHr__DriverPositionKeyword=Driver"
            "TvWallboard__AccessKey=secretref:tv-wallboard-access-key"
            "Cors__AllowedOrigins__0=https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io"
            "Deployment__Revision=$DEPLOY_SHA"
          )
          target_revision="$(az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/slh-tms-api:$DEPLOY_SHA" \
            --set-env-vars "${env_vars[@]}" \
            --query properties.latestRevisionName \
            --output tsv)"
          test -n "$target_revision"
          echo "TARGET_REVISION=$target_revision" >> "$GITHUB_ENV"
          echo "Created target revision $target_revision for $DEPLOY_SHA"

      - name: Route traffic to deployed ready revision
        run: |
          set -euo pipefail
          target_ready=false
          for attempt in {1..72}; do
            health_state="$(timeout 20s az containerapp revision list \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name=='$TARGET_REVISION'].properties.healthState | [0]" \
              --output tsv 2>/dev/null || true)"
            running_state="$(timeout 20s az containerapp revision list \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name=='$TARGET_REVISION'].properties.runningState | [0]" \
              --output tsv 2>/dev/null || true)"
            if test "$health_state" = "Healthy"; then
              target_ready=true
              break
            fi
            echo "Target revision $TARGET_REVISION is health=${health_state:-unknown}, running=${running_state:-unknown}; waiting ($attempt/72)..."
            sleep 10
          done
          test "$target_ready" = "true"
          az containerapp ingress traffic set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "$TARGET_REVISION=100"

      - name: Smoke test core API and SQL
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            health="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health?deployment=$DEPLOY_SHA" || true)"
            if echo "$health" | grep --quiet "$DEPLOY_SHA"; then
              break
            fi
            echo "Core API has not reported deployment $DEPLOY_SHA yet; retrying ($attempt/36)..."
            sleep 10
          done
          echo "$health" | grep --quiet "$DEPLOY_SHA"

          for attempt in {1..36}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/ready" || true)"
            if test "$status" = "200"; then break; fi
            echo "SQL readiness returned HTTP $status; retrying ($attempt/36)..."
            sleep 10
          done
          test "$status" = "200"

      - name: Verify operational routes fail closed
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://$AZURE_CONTAINER_APP_FQDN/api/v1/customers")"
          test "$status" = "401" -o "$status" = "403"

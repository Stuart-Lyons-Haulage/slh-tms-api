name: CD - Deploy TMS to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      refresh_infrastructure:
        description: Reapply registry and Key Vault secret bindings before deploying
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: slh-tms-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CONTAINER_REGISTRY: slhtmsacrprod
      AZURE_CONTAINER_APP_NAME: slh-tms-api-prod
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      AZURE_CONTAINER_APP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      AZURE_KEY_VAULT_URI: https://slh-tms-kv-prod.vault.azure.net

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image in Azure Container Registry
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "slh-tms-api:${{ github.sha }}" \
            --image slh-tms-api:latest \
            .

      - name: Wait for any previous Container App operation
        id: wait_for_container_app
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            state="$(timeout 20s az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.provisioningState \
              --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then
              echo "Container App is ready."
              exit 0
            fi
            echo "Container App provisioning state is ${state:-unknown}; waiting before deployment mutation ($attempt/45)..."
            sleep 10
          done
          echo "Container App did not report Succeeded, checking whether the live API is still healthy before continuing."
          if curl --fail --silent --show-error --max-time 10 "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health" >/dev/null; then
            echo "::warning::Container App provisioning state is still ${state:-unknown}, but the live API is healthy. Continuing with image-only deployment."
            exit 0
          fi
          echo "Container App did not return to Succeeded provisioning state and the live API health check failed."
          exit 1

      - name: Configure private registry access
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_infrastructure == 'true'
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if az containerapp registry set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$AZURE_CONTAINER_REGISTRY.azurecr.io" \
              --identity system; then
              exit 0
            fi
            echo "Registry configuration is busy; retrying ($attempt/18)..."
            sleep 10
          done
          exit 1

      - name: Wait after registry configuration
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_infrastructure == 'true'
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            state="$(timeout 20s az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.provisioningState --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then exit 0; fi
            echo "Waiting for registry operation to complete: ${state:-unknown} ($attempt/90)..."
            sleep 10
          done
          exit 1

      - name: Bind production secrets from Azure Key Vault
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_infrastructure == 'true'
        run: |
          set -euo pipefail
          secrets=(
            "tms-db-connection=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-tms-db-connection,identityref:system"
            "dot-api-key=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-api-key,identityref:system"
            "dot-base-url=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-base-url,identityref:system"
            "dot-company-code=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-company-code,identityref:system"
            "dot-password=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-password,identityref:system"
            "dot-username=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-username,identityref:system"
            "sagehr-api-key=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-sagehr-api-key,identityref:system"
            "sagehr-base-url=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-sagehr-base-url,identityref:system"
            "tv-wallboard-access-key=${{ secrets.TV_WALLBOARD_ACCESS_KEY }}"
          )
          for attempt in {1..18}; do
            if az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "${secrets[@]}"; then
              exit 0
            fi
            echo "Secret binding is busy; retrying ($attempt/18)..."
            sleep 10
          done
          exit 1

      - name: Wait after secret binding
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_infrastructure == 'true'
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            state="$(timeout 20s az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.provisioningState --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then exit 0; fi
            echo "Waiting for secret operation to complete: ${state:-unknown} ($attempt/90)..."
            sleep 10
          done
          exit 1

      - name: Deploy image with stable runtime configuration
        run: |
          set -euo pipefail
          env_vars=(
            "ConnectionStrings__TmsDb=secretref:tms-db-connection"
            "Tracking__Dot__Enabled=true"
            "Tracking__Dot__BaseUrl=secretref:dot-base-url"
            "Tracking__Dot__ApiKey=secretref:dot-api-key"
            "Tracking__Dot__CompanyCode=secretref:dot-company-code"
            "Tracking__Dot__Username=secretref:dot-username"
            "Tracking__Dot__Password=secretref:dot-password"
            "Tracking__Dot__PollIntervalMinutes=1"
            "Tracking__Dot__RecoveryIntervalMinutes=60"
            "Maps__Endpoint=https://atlas.microsoft.com"
            "Maps__ClientId=58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c"
            "Integrations__TachoMaster__Enabled=true"
            "Integrations__TachoMaster__BaseUrl=secretref:dot-base-url"
            "Integrations__TachoMaster__ApiKey=secretref:dot-api-key"
            "Integrations__TachoMaster__Username=secretref:dot-username"
            "Integrations__TachoMaster__Password=secretref:dot-password"
            "Integrations__SageHr__Enabled=true"
            "Integrations__SageHr__BaseUrl=secretref:sagehr-base-url"
            "Integrations__SageHr__ApiKey=secretref:sagehr-api-key"
            "Integrations__SageHr__DriverTeamName=Drivers"
            "Integrations__SageHr__DriverPositionKeyword=Driver"
            "TvWallboard__AccessKey=secretref:tv-wallboard-access-key"
            "Cors__AllowedOrigins__0=https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io"
            "Deployment__Revision=${{ github.sha }}"
          )
          for attempt in {1..18}; do
            if az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/slh-tms-api:${{ github.sha }}" \
              --set-env-vars "${env_vars[@]}"; then
              exit 0
            fi
            echo "Container image update is busy; retrying ($attempt/18)..."
            sleep 10
          done
          exit 1

      - name: Wait for deployed revision
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            state="$(timeout 20s az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.provisioningState --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then exit 0; fi
            echo "Waiting for image deployment to complete: ${state:-unknown} ($attempt/90)..."
            sleep 10
          done
          exit 1

      - name: Configure ingress and route traffic to latest revision
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if az containerapp ingress update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --target-port 80; then
              break
            fi
            echo "Ingress update is busy; retrying ($attempt/18)..."
            sleep 10
          done

          for attempt in {1..90}; do
            state="$(timeout 20s az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.provisioningState --output tsv 2>/dev/null || true)"
            if test "$state" = "Succeeded"; then break; fi
            echo "Waiting for ingress operation: ${state:-unknown} ($attempt/90)..."
            sleep 10
          done

          latest_revision="$(az containerapp revision list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'sort_by(@, &properties.createdTime)[-1].name' \
            --output tsv)"
          test -n "$latest_revision"

          az containerapp revision activate \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$latest_revision" || true

          for attempt in {1..18}; do
            if az containerapp ingress traffic set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision-weight "$latest_revision=100"; then
              exit 0
            fi
            echo "Traffic update is busy; retrying ($attempt/18)..."
            sleep 10
          done
          exit 1

      - name: Check versioned TMS health endpoint
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            health="$(curl --fail --silent --show-error "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health" || true)"
            if echo "$health" | grep --quiet "${{ github.sha }}"; then
              echo "$health"
              exit 0
            fi
            echo "Latest API revision is not serving traffic yet, retrying..."
            sleep 10
          done
          exit 1

      - name: Check Azure SQL readiness
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/ready")"
            if test "$status" = "200"; then exit 0; fi
            echo "Azure SQL is not ready yet (HTTP $status), retrying..."
            sleep 10
          done
          exit 1

      - name: Check operational data and schema readiness
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            body_file="$(mktemp)"
            status="$(curl --silent --output "$body_file" --write-out "%{http_code}" "https://$AZURE_CONTAINER_APP_FQDN/api/v1/diagnostics/data-readiness")"
            cat "$body_file"
            if test "$status" = "200"; then
              rm -f "$body_file"
              exit 0
            fi
            rm -f "$body_file"
            echo "Operational data/schema readiness returned HTTP $status; retrying..."
            sleep 10
          done
          echo "Operational data/schema readiness did not become healthy."
          exit 1

      - name: Check TachoMaster live integration
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body_file="$(mktemp)"
            status="$(curl --silent --output "$body_file" --write-out "%{http_code}" "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/tachomaster")"
            cat "$body_file"
            if test "$status" = "200"; then
              rm -f "$body_file"
              exit 0
            fi
            rm -f "$body_file"
            echo "TachoMaster live check returned HTTP $status; retrying..."
            sleep 10
          done
          exit 1

      - name: Verify operational API requires Microsoft Entra authentication
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out "%{http_code}" "https://$AZURE_CONTAINER_APP_FQDN/api/v1/customers")"
          test "$status" = "401"

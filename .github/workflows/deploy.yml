name: CD - Deploy TMS to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CONTAINER_REGISTRY: slhtmsacrprod
      AZURE_CONTAINER_APP_NAME: slh-tms-api-prod
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      AZURE_CONTAINER_APP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      AZURE_KEY_VAULT_URI: https://slh-tms-kv-prod.vault.azure.net

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image in Azure Container Registry
        run: |
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "slh-tms-api:${{ github.sha }}" \
            --image slh-tms-api:latest \
            .

      - name: Configure the app to pull from the private registry
        run: |
          az containerapp registry set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_CONTAINER_REGISTRY.azurecr.io" \
            --identity system || {
              echo "Registry pull identity is already configured or could not be changed by this workflow."
              echo "Continuing because the image update step will verify whether the app can pull the new image."
            }

      - name: Reference runtime secrets from Azure Key Vault
        run: |
          az containerapp secret set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              "tms-db-connection=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-tms-db-connection,identityref:system" \
              "dot-api-key=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-api-key,identityref:system" \
              "dot-base-url=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-base-url,identityref:system" \
              "dot-company-code=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-company-code,identityref:system" \
              "dot-password=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-password,identityref:system" \
              "dot-username=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-dot-username,identityref:system" \
              "sagehr-api-key=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-sagehr-api-key,identityref:system" \
              "sagehr-base-url=keyvaultref:$AZURE_KEY_VAULT_URI/secrets/slh-sagehr-base-url,identityref:system" || {
                echo "Key Vault secret references are already configured or this workflow cannot update them."
                echo "Continuing so the image deployment can proceed with the existing runtime configuration."
              }

      - name: Deploy image and configure ingress
        run: |
          az containerapp revision set-mode \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --mode multiple

          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/slh-tms-api:${{ github.sha }}" \
            --set-env-vars \
              "Tracking__Dot__Enabled=true" \
              "Tracking__Dot__BaseUrl=secretref:dot-base-url" \
              "Tracking__Dot__ApiKey=secretref:dot-api-key" \
              "Tracking__Dot__CompanyCode=secretref:dot-company-code" \
              "Tracking__Dot__Username=secretref:dot-username" \
              "Tracking__Dot__Password=secretref:dot-password" \
              "Integrations__SageHr__Enabled=true" \
              "Integrations__SageHr__BaseUrl=secretref:sagehr-base-url" \
              "Integrations__SageHr__ApiKey=secretref:sagehr-api-key" \
              "Integrations__SageHr__DriverTeamName=Drivers" \
              "Integrations__SageHr__DriverPositionKeyword=Driver" \
              "Integrations__Fleetio__Enabled=secretref:fleetio-enabled" \
              "Integrations__Fleetio__ApiKey=secretref:Fleetio--ApiKey" \
              "Integrations__Fleetio__AccountToken=secretref:fleetio-account-token" \
              "Integrations__Fleetio__BaseUrl=secretref:Fleetio--BaseUrl" \
              "Cors__AllowedOrigins__0=https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io" \
              "Deployment__Revision=${{ github.sha }}"

          az containerapp ingress update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 80

          latest_revision="$(az containerapp revision list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'sort_by(@, &properties.createdTime)[-1].name' \
            --output tsv)"
          test -n "$latest_revision"

          active="$(az containerapp revision show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --query properties.active \
            --output tsv)"
          if test "$active" != "true"; then
            az containerapp revision activate \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$latest_revision"
          fi

          az containerapp ingress traffic set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "$latest_revision=100"

      - name: Check versioned TMS health endpoint
        run: |
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error \
              "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health" || true)"
            if echo "$health" | grep --quiet "${{ github.sha }}"; then
              echo "$health"
              exit 0
            fi
            echo "Latest API revision is not serving traffic yet, retrying..."
            sleep 10
          done
          exit 1

      - name: Check Azure SQL readiness
        run: |
          for attempt in {1..60}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/ready")"
            if test "$status" = "200"; then
              exit 0
            fi
            echo "Azure SQL is not ready yet (HTTP $status), retrying..."
            sleep 10
          done
          echo "Azure SQL readiness endpoint did not return HTTP 200 after 10 minutes."
          exit 1

      - name: Verify operational API requires Microsoft Entra authentication
        run: |
          status="$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://$AZURE_CONTAINER_APP_FQDN/api/v1/customers")"
          test "$status" = "401"

name: Temporary TV Wallboard Parity Patch

on:
  push:
    branches:
      - fix/tv-geofence-linkage-parity-20260828
    paths:
      - .github/workflows/_temporary_tv_wallboard_parity_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-geofence-linkage-parity-20260828
          fetch-depth: 0
      - name: Apply paired TV access patch
        run: python3 .github/scripts/apply_tv_wallboard_parity_patch.py
      - name: Commit clean application patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Align paired TV shared wallboard access"
          git push origin HEAD:fix/tv-geofence-linkage-parity-20260828

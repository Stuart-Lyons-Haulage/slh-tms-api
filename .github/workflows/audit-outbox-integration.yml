name: Audit outbox integration

on:
  push:
    branches:
      - feature/audit-transactional-outbox
    paths:
      - .github/workflows/audit-outbox-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-transactional-outbox
          fetch-depth: 0

      - name: Merge current main and integrate audit outbox
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          for file in Data/TmsDbContext.cs Program.cs Slh.Tms.Api.Tests/GeofenceSitePromotionTests.cs Slh.Tms.Api.Tests/OrderReviewSiteMatchTests.cs; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$file"; then
              git checkout --theirs -- "$file"
              git add "$file"
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$remaining" ]; then
            echo 'Unresolved merge conflicts remain:' >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

          python .github/scripts/integrate-audit-outbox.py
          rm -f .github/workflows/audit-outbox-integration.yml .github/scripts/integrate-audit-outbox.py
          git add -A

          if git diff --cached --quiet; then
            echo 'No integration changes were produced.' >&2
            exit 1
          fi

          git commit -m 'Merge main and register audit outbox migration 45'
          git push origin HEAD:feature/audit-transactional-outbox

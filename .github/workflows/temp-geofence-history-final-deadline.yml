name: Temporary geofence history and final deadline repair

on:
  push:
    branches: [ fix/geofence-history-final-deadline-20260828 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geofence-history-final-deadline-20260828
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply ETA deadline and geofence history corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operations = Path('Controllers/OperationsController.cs')
          text = operations.read_text()
          old = '''            var visits = geofence?.Visits.Where(visit => visit.LoadId == load.Id).OrderBy(visit => visit.EnteredAtUtc).ToList() ?? [];
                      var completedStopIds = geofence is null ? new HashSet<Guid>() : GeofencePlanningMatch.CompletedStopIds(load, visits);
           
                      var current = live is null ? ((decimal Longitude, decimal Latitude)?)null : (live.Longitude, live.Latitude);'''
          new = '''            var visits = geofence?.Visits.Where(visit => visit.LoadId == load.Id).OrderBy(visit => visit.EnteredAtUtc).ToList() ?? [];
                      var completedStopIds = geofence is null ? new HashSet<Guid>() : GeofencePlanningMatch.CompletedStopIds(load, visits);
                      var finalDestination = RunFinalDestination.Select(load.Stops);
           
                      var current = live is null ? ((decimal Longitude, decimal Latitude)?)null : (live.Longitude, live.Latitude);'''
          if old not in text:
              raise SystemExit('Operations final-destination insertion point not found')
          text = text.replace(old, new, 1)
          old = '''                var windowStart = order?.DeliveryWindowStartUtc;
                          var windowEnd = order?.DeliveryWindowEndUtc;
                          var tachoAssessment = source == "Live"'''
          new = '''                var windowStart = order?.DeliveryWindowStartUtc;
                          var windowEnd = order?.DeliveryWindowEndUtc;
                          if (windowEnd is null && finalDestination is not null && stop.Id == finalDestination.Id)
                              windowEnd = finalDestination.PlannedArrivalUtc;
                          var tachoAssessment = source == "Live"'''
          if old not in text:
              raise SystemExit('Operations delivery window block not found')
          text = text.replace(old, new, 1)
          old = '''        if (eta > end) return "Late";
                  if (end - eta <= TimeSpan.FromMinutes(30)) return "AtRisk";
                  return "OnTrack";'''
          new = '''        if (eta > end) return "Late";
                  // Final-customer risk is deadline based. A live ETA at or before the
                  // latest accepted delivery time remains on track, even with a small buffer.
                  return "OnTrack";'''
          if old not in text:
              raise SystemExit('Operations Risk block not found')
          text = text.replace(old, new, 1)
          operations.write_text(text)

          route = Path('Controllers/TvRouteProgressController.cs')
          text = route.read_text()
          old = '''        // TV reads must remain bounded. Current RoadTech ingestion and the shared geofence
                  // engine run continuously in the background; a display refresh must consume that durable
                  // projection rather than replaying the whole operating day synchronously.
                  var liveStatuses = await SafeList(db.VehicleLiveStatuses.AsNoTracking(), ct);
                  var snapshot = new EmbeddedGeofenceSnapshot(
                      EmbeddedGeofenceEngine.ApprovedFences,
                      [],
                      [],
                      [],
                      0,
                      liveStatuses.Count > 0 ? liveStatuses.Max(status => status.LastReceivedAtUtc) : null);
                  snapshot = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, snapshot, loads, ct);'''
          new = '''        // Use the same RoadTech + historical reconstruction + durable SQL evidence as
                  // the signed-in Operations wallboard. This keeps TV dots, History and Progress
                  // non-regressive and prevents a durable-projection lag from hiding real site hits.
                  var (liveStatuses, liveTrackingSource) = await LoadLiveStatusesAsync(now, ct);
                  EmbeddedGeofenceSnapshot snapshot;
                  try
                  {
                      snapshot = await EmbeddedGeofenceEngine.BuildAsync(db, day, GeofencePlanningMatch.PrepareLoads(loads), ct);
                      snapshot = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, snapshot, loads, ct);

                      // Backfill reconstructed history into the durable projection so legacy TV clients,
                      // timelines and subsequent reads all see the same ENTER/EXIT evidence.
                      try
                      {
                          await EmbeddedGeofenceSqlProjection.PersistAsync(db, snapshot, ct);
                      }
                      catch (Exception projectionException) when (projectionException is not OperationCanceledException)
                      {
                          db.ChangeTracker.Clear();
                          logger.LogWarning(projectionException, "TV geofence history reconstruction could not be persisted; reconstructed evidence remains visible for this refresh.");
                      }
                  }
                  catch (Exception exception) when (exception is not OperationCanceledException)
                  {
                      db.ChangeTracker.Clear();
                      logger.LogWarning(exception, "TV geofence history reconstruction failed; falling back to the latest durable projection.");
                      snapshot = new EmbeddedGeofenceSnapshot(
                          EmbeddedGeofenceEngine.ApprovedFences,
                          [],
                          [],
                          [],
                          0,
                          liveStatuses.Count > 0 ? liveStatuses.Max(status => status.LastReceivedAtUtc) : null);
                      snapshot = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, snapshot, loads, ct);
                  }'''
          if old not in text:
              raise SystemExit('TV route durable-only block not found')
          text = text.replace(old, new, 1)
          old = '            trackingSource = "SQL live status + durable geofence projection",'
          new = '            trackingSource = $"{liveTrackingSource} + reconstructed/durable geofence projection",'
          if old not in text:
              raise SystemExit('TV trackingSource response line not found')
          text = text.replace(old, new, 1)
          route.write_text(text)

          legacy = Path('Controllers/TvDisplayController.cs')
          text = legacy.read_text()
          old = '            var finalStop = stops.LastOrDefault();'
          new = '            var finalStop = RunFinalDestination.Select(stops);'
          if old not in text:
              raise SystemExit('Legacy TV final stop selector not found')
          text = text.replace(old, new, 1)
          legacy.write_text(text)
          PY
      - name: Restore
        run: dotnet restore Slh.Tms.Api.sln
      - name: Build
        run: dotnet build Slh.Tms.Api.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Slh.Tms.Api.sln --configuration Release --no-build
      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-geofence-history-final-deadline.yml
          git add Controllers/OperationsController.cs Controllers/TvRouteProgressController.cs Controllers/TvDisplayController.cs
          git commit -m "Align final ETA deadlines and geofence history"
          git push origin HEAD:fix/geofence-history-final-deadline-20260828

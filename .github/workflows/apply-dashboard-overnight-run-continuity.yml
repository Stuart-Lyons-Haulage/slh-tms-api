name: Apply dashboard and overnight continuity repair

on:
  push:
    branches:
      - fix/dashboard-overnight-run-continuity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply dashboard and overnight continuity fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-overnight-run-continuity
          fetch-depth: 0
      - name: Apply source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Dashboard/readiness must consume the same reconciled operational runs as the wallboards.
          p = Path('Controllers/RunReadinessController.cs')
          s = p.read_text()
          old = '''        var merged = new Dictionary<Guid, Load>();

        try
        {
            foreach (var load in await db.Loads.AsNoTracking().Include(x => x.Stops)
                .Where(x => x.PlanningDate == day && x.Status != LoadStatus.Cancelled)
                .OrderBy(x => x.Reference).Take(1000).ToListAsync(ct))
                merged[load.Id] = load;
        }
        catch (Exception ex) when (PlanningResilience.SchemaUnavailable(ex))
        {
            db.ChangeTracker.Clear();
        }

        foreach (var load in await PlanningRegisterStore.ReadLoadsAsync(db, day, ct))
            if (load.Status != LoadStatus.Cancelled && !merged.ContainsKey(load.Id)) merged[load.Id] = load;

        var loads = merged.Values.ToList();
'''
          new = '''        var loads = (await PlanningResilience.ReadLoadsAsync(db, day, ct))
            .Where(load => load.Status != LoadStatus.Cancelled)
            .OrderBy(load => load.Reference)
            .Take(1000)
            .ToList();
'''
          if old not in s:
              raise SystemExit('RunReadiness source block not found')
          p.write_text(s.replace(old, new))

          # 2) A planning day can contain a PM collection from the previous calendar evening,
          # followed by post-midnight work on the planning date. Normalise that carry-in in all
          # resilient operational reads so current production data is corrected without re-import.
          p = Path('Controllers/PlanningResilienceController.cs')
          s = p.read_text()
          old = '''    internal static List<Load> CollapseLogicalDuplicates(IEnumerable<Load> loads)
    {
        var result = new List<Load>();
        foreach (var group in loads.GroupBy(LogicalRunKey, StringComparer.OrdinalIgnoreCase))
'''
          new = '''    internal static List<Load> CollapseLogicalDuplicates(IEnumerable<Load> loads)
    {
        var normalizedLoads = loads.ToList();
        foreach (var load in normalizedLoads) NormalizeOvernightCarryInTimes(load);

        var result = new List<Load>();
        foreach (var group in normalizedLoads.GroupBy(LogicalRunKey, StringComparer.OrdinalIgnoreCase))
'''
          if old not in s:
              raise SystemExit('PlanningResilience collapse block not found')
          s = s.replace(old, new)
          marker = '''    public static async Task<Load?> ReadLoadAsync(TmsDbContext db, Guid id, CancellationToken ct)
'''
          helper = '''    /// <summary>
    /// Planner operating dates describe the main delivery day. When the first planned stop is
    /// 15:00 or later and a later stop is before 15:00, the route crosses midnight: the leading
    /// PM block belongs to the previous calendar evening. This is common for pre-loaded/overnight
    /// runs where the driver collects, takes daily rest in the vehicle, then continues the same
    /// run after midnight. Only the leading PM block is shifted, so genuine same-day PM work is
    /// untouched.
    /// </summary>
    internal static void NormalizeOvernightCarryInTimes(Load load)
    {
        var timedStops = load.Stops
            .Where(stop => stop.PlannedArrivalUtc is not null)
            .OrderBy(stop => stop.Sequence)
            .ToList();
        if (timedStops.Count < 2) return;

        var firstLocal = UkLocal(timedStops[0].PlannedArrivalUtc!.Value);
        if (firstLocal.TimeOfDay < TimeSpan.FromHours(15)) return;
        if (!timedStops.Skip(1).Any(stop => UkLocal(stop.PlannedArrivalUtc!.Value).TimeOfDay < TimeSpan.FromHours(15))) return;

        var crossedIntoPlanningDay = false;
        foreach (var stop in timedStops)
        {
            var value = stop.PlannedArrivalUtc!.Value;
            var local = UkLocal(value);
            if (local.TimeOfDay < TimeSpan.FromHours(15))
            {
                crossedIntoPlanningDay = true;
                continue;
            }
            if (crossedIntoPlanningDay) continue;
            if (DateOnly.FromDateTime(local.DateTime) != load.PlanningDate) continue;
            stop.PlannedArrivalUtc = value.AddDays(-1);
        }
    }

    private static DateTimeOffset UkLocal(DateTimeOffset value)
    {
        try
        {
            var id = OperatingSystem.IsWindows() ? "GMT Standard Time" : "Europe/London";
            return TimeZoneInfo.ConvertTime(value, TimeZoneInfo.FindSystemTimeZoneById(id));
        }
        catch (TimeZoneNotFoundException)
        {
            return value;
        }
    }

'''
          if marker not in s:
              raise SystemExit('PlanningResilience insertion marker not found')
          p.write_text(s.replace(marker, helper + marker))

          # 3) Run AM/PM is execution truth: first planned stop time beats a stale imported run-type label.
          p = Path('Controllers/TvDisplayRunLabelsController.cs')
          s = p.read_text()
          old = '''        var source = string.IsNullOrWhiteSpace(plannerRun) ? StripInternalReference(load.Reference) : plannerRun.Trim();
        var period = ExplicitPeriod(source) ?? ExplicitPeriod(runType) ?? PeriodFromFirstStop(load);
        return Format(source, period);
'''
          new = '''        var source = string.IsNullOrWhiteSpace(plannerRun) ? StripInternalReference(load.Reference) : plannerRun.Trim();
        var plannedPeriod = PeriodFromFirstStop(load);
        if (plannedPeriod is not null && NumericRunRegex().IsMatch(source))
            source = PeriodRegex().Replace(source, string.Empty).Trim();
        var period = plannedPeriod ?? ExplicitPeriod(source) ?? ExplicitPeriod(runType);
        return Format(source, period);
'''
          if old not in s:
              raise SystemExit('RunDisplayLabel period block not found')
          p.write_text(s.replace(old, new))

          # 4) Expose final destination and carry-in state directly in the TV progression contract.
          p = Path('Controllers/TvRouteProgressController.cs')
          s = p.read_text()
          old = '''            var stops = load.Stops.OrderBy(x => x.Sequence).ToList();
            var visits = snapshot.Visits.Where(x => x.LoadId == load.Id).OrderBy(x => x.EnteredAtUtc).ToList();
'''
          new = '''            var stops = load.Stops.OrderBy(x => x.Sequence).ToList();
            var finalDestination = RunFinalDestination.Select(stops);
            var carryInFromPreviousDay = stops
                .Where(stop => stop.PlannedArrivalUtc is not null)
                .Select(stop => UkOperatingDate(stop.PlannedArrivalUtc!.Value))
                .Any(stopDay => stopDay < load.PlanningDate);
            var visits = snapshot.Visits.Where(x => x.LoadId == load.Id).OrderBy(x => x.EnteredAtUtc).ToList();
'''
          if old not in s:
              raise SystemExit('TvRouteProgress stop block not found')
          s = s.replace(old, new)
          old = '''                focusStop = focusStop?.Name,
                phase,
                truckPositionPercent = truckPosition,
'''
          new = '''                focusStop = focusStop?.Name,
                phase,
                finalDestinationStopId = finalDestination?.Id,
                finalDestinationName = finalDestination?.Name,
                carryInFromPreviousDay,
                truckPositionPercent = truckPosition,
'''
          if old not in s:
              raise SystemExit('TvRouteProgress response block not found')
          p.write_text(s.replace(old, new))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Controllers/RunReadinessController.cs Controllers/PlanningResilienceController.cs Controllers/TvDisplayRunLabelsController.cs Controllers/TvRouteProgressController.cs
          git commit -m "Apply dashboard and overnight continuity fix"
          git push origin HEAD:fix/dashboard-overnight-run-continuity

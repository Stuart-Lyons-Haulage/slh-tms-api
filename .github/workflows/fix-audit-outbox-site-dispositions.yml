name: Fix audit outbox site dispositions

on:
  push:
    branches:
      - feature/audit-transactional-outbox
    paths:
      - .github/workflows/fix-audit-outbox-site-dispositions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-transactional-outbox
          fetch-depth: 0
      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          python .github/scripts/fix-audit-outbox-site-dispositions.py
          rm -f .github/workflows/fix-audit-outbox-site-dispositions.yml .github/scripts/fix-audit-outbox-site-dispositions.py
          git add -A
          git commit -m 'Honor pending audit dispositions during site reconciliation'
          git push origin HEAD:feature/audit-transactional-outbox

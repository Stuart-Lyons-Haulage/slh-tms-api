name: CI - Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-

      - name: Restore dependencies
        run: dotnet restore Slh.Tms.Api.csproj

      - name: Build API project (Release)
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Slh.Tms.Api.csproj --configuration Release --no-build

      - name: Build portal
        working-directory: Portal
        run: |
          npm install
          npm run build


name: CI - Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync validated Falcon source on repair PR
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/falcon-geofence-source-555-v2' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/falcon-geofence-source-555

          for n in 01 02 03 04 05 06 07 08 09 10; do
            git show "origin/fix/falcon-geofence-source-555:Services/GeofenceSeedPayload.Part${n}.cs" > "/tmp/part${n}.cs"
            sed \
              -e "s/internal static partial class GeofenceSeedPayloadParts/internal static class GeofencePayloadChunk${n}/" \
              -e "s/internal const string Part${n}/internal const string Value/" \
              "/tmp/part${n}.cs" > "Services/GeofencePayloadChunk${n}.cs"
          done

          git show origin/fix/falcon-geofence-source-555:Services/EmbeddedGeofenceEngine.cs > /tmp/EmbeddedGeofenceEngine.cs
          sed \
            -e 's/GeofenceSeedPayload\.Json/OperationalGeofencePayload.Json/g' \
            -e 's/GeofenceSeedPayload\.ApprovedGeofenceCount/OperationalGeofencePayload.ExpectedFenceCount/g' \
            /tmp/EmbeddedGeofenceEngine.cs > Services/EmbeddedGeofenceEngine.cs

          git show origin/fix/falcon-geofence-source-555:Slh.Tms.Api.Tests/EmbeddedGeofenceEngineTests.cs > Slh.Tms.Api.Tests/EmbeddedGeofenceEngineTests.cs

          python3 - <<'PY'
          from pathlib import Path
          import re
          chunks=[]
          for n in range(1,11):
              text=Path(f'Services/GeofencePayloadChunk{n:02d}.cs').read_text()
              match=re.search(r'internal const string Value = "([A-Za-z0-9+/=]+)";', text)
              assert match, f'chunk {n:02d} missing payload'
              chunks.append(match.group(1))
          encoded=''.join(chunks)
          assert len(encoded)==153228, len(encoded)
          print(f'Validated concatenated Base64 length: {len(encoded)}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/GeofencePayloadChunk*.cs Services/EmbeddedGeofenceEngine.cs Slh.Tms.Api.Tests/EmbeddedGeofenceEngineTests.cs
          if ! git diff --cached --quiet; then
            git commit -m "Sync validated Falcon geofence payload [payload-sync]"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          fi

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-

      - name: Restore dependencies
        run: |
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj

      - name: Build API project (Release)
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore

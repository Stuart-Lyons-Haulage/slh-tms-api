name: Hotfix Source Line Site Master

on:
  push:
    paths:
      - '.github/workflows/hotfix-source-line-site-master.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch source-line normalisation
        shell: python
        run: |
          from pathlib import Path
          path = Path('Services/StagingService.cs')
          text = path.read_text()
          old = '''            var collectionSite = Text(line, "collectionSite") ?? Text(line, "collectionLocation") ?? Text(payload, "collectionSite") ?? Text(payload, "collectionLocation");\n            var deliverySite = Text(line, "deliverySite") ?? Text(line, "deliveryLocation") ?? Text(payload, "deliverySite") ?? Text(payload, "deliveryLocation");\n            var lineCollectionDate = DateOnlyOrNull(line, "collectionDate") ?? DateOnlyOrNull(payload, "collectionDate");\n'''
          new = '''            var rawCollectionSite = Text(line, "collectionSite") ?? Text(line, "collectionLocation") ?? Text(payload, "collectionSite") ?? Text(payload, "collectionLocation") ?? Text(payload, "sellerName");\n            var rawDeliverySite = Text(line, "deliverySite") ?? Text(line, "deliveryLocation") ?? Text(payload, "deliverySite") ?? Text(payload, "deliveryLocation") ?? Text(payload, "stallNumber");\n            var lineAlignment = await OrderSiteMasterAlignment.ResolveNamesAsync(\n                db, rawCollectionSite, rawDeliverySite,\n                Text(line, "collectionAddress") ?? Text(payload, "collectionAddress"),\n                Text(line, "deliveryAddress") ?? Text(payload, "deliveryAddress"),\n                Text(line, "mapLink") ?? Text(payload, "mapLink"),\n                Text(line, "driverInstructions") ?? Text(payload, "driverInstructions"), ct);\n            var collectionSite = lineAlignment.CollectionName ?? rawCollectionSite;\n            var deliverySite = lineAlignment.DeliveryName ?? rawDeliverySite;\n            var lineCollectionDate = DateOnlyOrNull(line, "collectionDate") ?? DateOnlyOrNull(payload, "collectionDate");\n'''
          if old not in text:
              raise SystemExit('Source line site block not found')
          text = text.replace(old, new)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "SLH TMS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Services/StagingService.cs
          git diff --cached --quiet && exit 0
          git commit -m "Normalise order source lines through Site Master"
          git push origin main

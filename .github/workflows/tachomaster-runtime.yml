name: Repair TachoMaster runtime configuration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CONTAINER_APP_NAME: slh-tms-api-prod
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      AZURE_CONTAINER_APP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
    steps:
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bind TachoMaster to authenticated RoadTech credentials
        run: |
          set -euo pipefail
          existing_secrets="$(az containerapp secret list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[].name' --output tsv)"

          for required in dot-api-key dot-username dot-password dot-base-url; do
            if ! printf '%s\n' "$existing_secrets" | grep -Fxiq "$required"; then
              echo "Required RoadTech runtime secret is missing: $required"
              exit 1
            fi
          done

          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars \
              "Integrations__TachoMaster__Enabled=true" \
              "Integrations__TachoMaster__BaseUrl=secretref:dot-base-url" \
              "Integrations__TachoMaster__ApiKey=secretref:dot-api-key" \
              "Integrations__TachoMaster__Username=secretref:dot-username" \
              "Integrations__TachoMaster__Password=secretref:dot-password"

      - name: Verify TachoMaster upstream connection
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body="$(curl --silent --show-error --max-time 45 "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/tachomaster" || true)"
            echo "$body"
            status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
            connection="$(jq -r '.connectionFreshness // empty' <<<"$body" 2>/dev/null || true)"
            if test "$status" != "upstream-failure" -a "$status" != "unconfigured" -a "$connection" = "live"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify scheduled TachoMaster job configuration
        run: |
          set -euo pipefail
          trigger="$(az containerapp job show \
            --name slh-tms-job-tachomaster \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.triggerType \
            --output tsv)"
          cron="$(az containerapp job show \
            --name slh-tms-job-tachomaster \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.scheduleTriggerConfig.cronExpression \
            --output tsv)"
          image="$(az containerapp job show \
            --name slh-tms-job-tachomaster \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          test "$trigger" = "Schedule"
          test "$cron" = "*/5 * * * *"
          test -n "$image"
          echo "TachoMaster trigger=$trigger cron=$cron image=$image"

      - name: Verify scheduled sync freshness
        run: |
          set -euo pipefail
          success=false
          for attempt in {1..24}; do
            body="$(curl --silent --show-error --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/tachomaster" || true)"
            echo "$body"
            stale="$(jq -r 'if .scheduledSync.stale == null then true else .scheduledSync.stale end' <<<"$body" 2>/dev/null || true)"
            age="$(jq -r '.scheduledSync.ageMinutes // empty' <<<"$body" 2>/dev/null || true)"
            if test "$stale" = "false"; then
              echo "Scheduled TachoMaster sync is fresh; age=${age:-unknown} minutes."
              success=true
              break
            fi
            sleep 15
          done

          if test "$success" != "true"; then
            echo "::error::TachoMaster upstream is reachable, but the scheduled synchronisation remains stale."
            az containerapp job execution list \
              --name slh-tms-job-tachomaster \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output table || true
            exit 1
          fi

name: Patch canonical wallboard route progress

on:
  push:
    branches:
      - fix/canonical-wallboard-route-progress
    paths:
      - '.github/workflows/patch-canonical-wallboard-route-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-wallboard-route-progress
          token: ${{ github.token }}
      - name: Replace request-time geofence rebuild with durable projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Controllers/TvRouteProgressController.cs')
          text = path.read_text()
          start_marker = '        // Live Tracking in the TMS asks Falcon directly.'
          end_marker = '        snapshot = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, snapshot, loads, ct);'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end < start:
              raise SystemExit('TvRouteProgressController markers not found')
          end += len(end_marker)
          replacement = '''        // TV reads must remain bounded. Current RoadTech ingestion and the shared geofence\n        // engine run continuously in the background; a display refresh must consume that durable\n        // projection rather than replaying the whole operating day synchronously.\n        var liveStatuses = await SafeList(db.VehicleLiveStatuses.AsNoTracking(), ct);\n        var snapshot = new EmbeddedGeofenceSnapshot(\n            EmbeddedGeofenceEngine.ApprovedFences,\n            [],\n            [],\n            [],\n            0,\n            liveStatuses.Count > 0 ? liveStatuses.Max(status => status.LastReceivedAtUtc) : null);\n        snapshot = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, snapshot, loads, ct);'''
          text = text[:start] + replacement + text[end:]
          old_source = '            trackingSource = liveSnapshot.Source,'
          new_source = '            trackingSource = "SQL live status + durable geofence projection",'
          if old_source not in text:
              raise SystemExit('trackingSource marker not found')
          text = text.replace(old_source, new_source, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/patch-canonical-wallboard-route-progress.yml')
          workflow.unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Controllers/TvRouteProgressController.cs .github/workflows/patch-canonical-wallboard-route-progress.yml
          git commit -m 'Bound TV route progress to durable evidence'
          git push origin HEAD:fix/canonical-wallboard-route-progress

name: One-shot TachoMaster SQL identity repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tachomaster-live-diagnostics.yml

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      API_APP: slh-tms-api-prod
      API_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TACHO_JOB: slh-tms-job-tachomaster
      JOB_SQL_USER: slh-tms-jobs-prod-id
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Grant job identity access to TMS SQL database
        shell: bash
        run: |
          set -euo pipefail
          source_secrets="$(az containerapp secret list --name "$API_APP" --resource-group "$AZURE_RESOURCE_GROUP" --show-values --output json)"
          conn="$(jq -r '[.[] | select(.name == "tms-db-connection")][0].value // empty' <<<"$source_secrets")"
          test -n "$conn"

          server="$(printf '%s' "$conn" | tr ';' '\n' | sed -n -E 's/^[[:space:]]*(Server|Data Source)[[:space:]]*=[[:space:]]*//Ip' | head -1)"
          database="$(printf '%s' "$conn" | tr ';' '\n' | sed -n -E 's/^[[:space:]]*(Database|Initial Catalog)[[:space:]]*=[[:space:]]*//Ip' | head -1)"
          server="${server#tcp:}"
          test -n "$server"
          test -n "$database"

          job_principal_id="$(az containerapp job show \
            --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'identity.userAssignedIdentities.*.principalId | [0]' --output tsv)"
          test -n "$job_principal_id"

          curl -sSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev >/dev/null
          python -m pip install --quiet pyodbc
          export SQL_SERVER="$server" SQL_DATABASE="$database" JOB_PRINCIPAL_ID="$job_principal_id"
          python <<'PY'
          import os, struct, subprocess, uuid
          import pyodbc

          token = subprocess.check_output([
              'az','account','get-access-token','--resource','https://database.windows.net/',
              '--query','accessToken','--output','tsv'
          ], text=True).strip()
          raw = token.encode('utf-16-le')
          packed = struct.pack('<I', len(raw)) + raw
          cs = (
              'Driver={ODBC Driver 18 for SQL Server};'
              f"Server={os.environ['SQL_SERVER']};Database={os.environ['SQL_DATABASE']};"
              'Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30;'
          )
          cn = pyodbc.connect(cs, attrs_before={1256: packed}, autocommit=True)
          cur = cn.cursor()
          name = 'slh-tms-jobs-prod-id'
          principal = os.environ['JOB_PRINCIPAL_ID']
          existing = cur.execute('SELECT COUNT(*) FROM sys.database_principals WHERE name = ?', name).fetchone()[0]
          if not existing:
              try:
                  cur.execute(f'CREATE USER [{name}] FROM EXTERNAL PROVIDER')
              except Exception:
                  sid = uuid.UUID(principal).bytes_le.hex().upper()
                  cur.execute(f'CREATE USER [{name}] WITH SID = 0x{sid}, TYPE = E')
          for role in ('db_datareader','db_datawriter'):
              member = cur.execute('''
                  SELECT COUNT(*)
                  FROM sys.database_role_members drm
                  JOIN sys.database_principals r ON r.principal_id = drm.role_principal_id
                  JOIN sys.database_principals m ON m.principal_id = drm.member_principal_id
                  WHERE r.name = ? AND m.name = ?
              ''', role, name).fetchone()[0]
              if not member:
                  cur.execute(f'ALTER ROLE [{role}] ADD MEMBER [{name}]')
          cur.execute(f'GRANT EXECUTE TO [{name}]')
          print('SQL job identity exists with db_datareader, db_datawriter and EXECUTE grants.')
          cn.close()
          PY

      - name: Run canonical TachoMaster sync immediately
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query name --output tsv)"
          echo "EXECUTION=$execution"
          for attempt in {1..60}; do
            state="$(az containerapp job execution show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status --output tsv 2>/dev/null || true)"
            echo "status=${state:-unknown}"
            case "$state" in
              Succeeded) exit 0 ;;
              Failed)
                timeout 30s az containerapp job logs show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --execution "$execution" --container "$TACHO_JOB" --follow false --tail 180 --format text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          exit 1

      - name: Verify canonical Driver Master
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl --silent --show-error --max-time 45 -H 'Cache-Control: no-cache' "https://$API_FQDN/api/v1/health/driver-master" || true)"
            echo "$body"
            member_dupes="$(jq -r '.duplicateMemberGroups // -1' <<<"$body" 2>/dev/null || echo -1)"
            card_dupes="$(jq -r '.duplicateCardGroups // -1' <<<"$body" 2>/dev/null || echo -1)"
            aligned="$(jq -r '.populationAligned // false' <<<"$body" 2>/dev/null || echo false)"
            latest="$(jq -r '.latestCanonicalSyncUtc // empty' <<<"$body" 2>/dev/null || true)"
            if test "$member_dupes" = "0" -a "$card_dupes" = "0" -a "$aligned" = "true" -a -n "$latest"; then
              echo "Canonical Driver Master clean/aligned at $latest"
              exit 0
            fi
            sleep 10
          done
          exit 1

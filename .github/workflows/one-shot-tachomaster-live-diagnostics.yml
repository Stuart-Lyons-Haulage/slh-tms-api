name: One-shot permanent TachoMaster identity patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tachomaster-live-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add governed SQL identity migration and durable job connection wiring
        shell: python
        run: |
          from pathlib import Path

          migration = Path('Database/060_TachoMaster_Job_Managed_Identity.sql')
          migration.write_text(r'''/*
            Provision the governed user-assigned identity used by production Container Apps jobs.
            Idempotent and deliberately limited to runtime DML/execute rights; no DDL/admin role.
          */
          SET XACT_ABORT ON;

          DECLARE @JobUser sysname = N'slh-tms-jobs-prod-id';
          DECLARE @JobObjectId uniqueidentifier = '75197000-83d6-47e5-b797-7532db12c508';

          IF DATABASE_PRINCIPAL_ID(@JobUser) IS NULL
          BEGIN
              DECLARE @SidHex nvarchar(34) = CONVERT(nvarchar(34), CONVERT(varbinary(16), @JobObjectId), 1);
              EXEC(N'CREATE USER [' + @JobUser + N'] WITH SID = ' + @SidHex + N', TYPE = E;');
          END;

          IF IS_ROLEMEMBER(N'db_datareader', @JobUser) <> 1
              EXEC(N'ALTER ROLE [db_datareader] ADD MEMBER [' + @JobUser + N'];');

          IF IS_ROLEMEMBER(N'db_datawriter', @JobUser) <> 1
              EXEC(N'ALTER ROLE [db_datawriter] ADD MEMBER [' + @JobUser + N'];');

          EXEC(N'GRANT EXECUTE TO [' + @JobUser + N'];');
          ''')

          runner = Path('Services/SchemaMigrationRunner.cs')
          text = runner.read_text()
          old = '        "059_RoadTech_Operational_Visits.sql"\n'
          new = '        "059_RoadTech_Operational_Visits.sql",\n        "060_TachoMaster_Job_Managed_Identity.sql"\n'
          if old not in text:
              raise SystemExit('Schema migration catalogue insertion point not found')
          runner.write_text(text.replace(old, new, 1))

          deploy = Path('.github/workflows/deploy-jobs.yml')
          text = deploy.read_text()
          old = '''          tms_db="$(secret_value tms-db-connection)"\n          dot_base="$(secret_value dot-base-url)"'''
          new = '''          tms_db="$(secret_value tms-db-connection)"\n          job_mi_client_id="$(az containerapp job show \\\n            --name "$TACHO_JOB" \\\n            --resource-group "$AZURE_RESOURCE_GROUP" \\\n            --query 'identity.userAssignedIdentities.*.clientId | [0]' \\\n            --output tsv)"\n          if test -z "$job_mi_client_id"; then\n            echo "::error::$TACHO_JOB must have a user-assigned managed identity before deployment."\n            exit 1\n          fi\n          if grep -qi 'Authentication=Active Directory Managed Identity' <<<"$tms_db"; then\n            tms_db="$(printf '%s' "$tms_db" | sed -E 's/(^|;)[[:space:]]*[Uu]ser[[:space:]]+[Ii][Dd]=[^;]*//g')"\n            tms_db="${tms_db%;};User Id=${job_mi_client_id};"\n          fi\n          dot_base="$(secret_value dot-base-url)"'''
          if old not in text:
              raise SystemExit('deploy-jobs identity insertion point not found')
          deploy.write_text(text.replace(old, new, 1))

      - name: Validate repaired solution
        run: |
          set -euo pipefail
          dotnet build Slh.Tms.Api.csproj -c Release
          dotnet build Slh.Tms.Jobs/Slh.Tms.Jobs.csproj -c Release
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj -c Release --no-build || dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj -c Release

      - name: Commit permanent repair
        run: |
          set -euo pipefail
          git config user.name "slh-tms-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Database/060_TachoMaster_Job_Managed_Identity.sql Services/SchemaMigrationRunner.cs .github/workflows/deploy-jobs.yml
          git commit -m "Provision scheduled job SQL managed identity"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: One-shot TachoMaster live diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tachomaster-live-diagnostics.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      API_APP: slh-tms-api-prod
      TACHO_JOB: slh-tms-job-tachomaster
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect production SQL identity wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '=== API identity ==='
          az containerapp show --name "$API_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query identity --output json
          echo '=== Tacho job identity ==='
          az containerapp job show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query identity --output json

          source_secrets="$(az containerapp secret list --name "$API_APP" --resource-group "$AZURE_RESOURCE_GROUP" --show-values --output json)"
          conn="$(jq -r '[.[] | select(.name == "tms-db-connection")][0].value // empty' <<<"$source_secrets")"
          auth="$(sed -n 's/.*[Aa]uthentication=\([^;]*\).*/\1/p' <<<"$conn")"
          userid="$(sed -n 's/.*[Uu]ser [Ii][Dd]=\([^;]*\).*/\1/p' <<<"$conn")"
          echo "SQL_AUTH_MODE=${auth:-not-explicit}"
          if test -n "$userid"; then echo "SQL_CONNECTION_HAS_USER_ID=true"; else echo "SQL_CONNECTION_HAS_USER_ID=false"; fi

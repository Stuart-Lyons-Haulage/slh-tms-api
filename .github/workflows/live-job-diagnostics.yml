name: One-shot - Production scheduled job diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-job-diagnostics.yml'

permissions:
  contents: write
  id-token: write

env:
  AZURE_RESOURCE_GROUP: slh-tms-prod-rg
  TACHO_JOB: slh-tms-job-tachomaster
  ETA_JOB: slh-tms-job-eta
  TACHO_EXECUTION: slh-tms-job-tachomaster-r32gbyc

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture job definitions and failure logs
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          out=diagnostics/live-job-diagnostics.txt
          : > "$out"
          section() { printf '\n===== %s =====\n' "$1" >> "$out"; }
          redact() {
            sed -E \
              -e 's/(Password|ApiKey|ConnectionString|secret|token)([=: ]+)[^ ,;\"]+/\1\2[REDACTED]/Ig' \
              -e 's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1[REDACTED]@#g'
          }

          section 'Tacho job summary'
          az containerapp job show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{name:name,provisioningState:properties.provisioningState,triggerType:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,image:properties.template.containers[0].image,envNames:properties.template.containers[0].env[].name}' -o json 2>&1 | redact >> "$out" || true

          section 'ETA job summary'
          az containerapp job show --name "$ETA_JOB" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{name:name,provisioningState:properties.provisioningState,triggerType:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,image:properties.template.containers[0].image,envNames:properties.template.containers[0].env[].name}' -o json 2>&1 | redact >> "$out" || true

          section 'Failed Tacho execution definition'
          az containerapp job execution show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$TACHO_EXECUTION" -o json 2>&1 | \
            jq 'if type=="object" then {name:.name,status:.properties.status,startTime:.properties.startTime,endTime:.properties.endTime,template:{containers:[.properties.template.containers[]? | {name,image,envNames:[.env[]?.name]}]}} else . end' 2>/dev/null | redact >> "$out" || true

          section 'Azure CLI job log help'
          az containerapp job logs show --help 2>&1 | head -120 | redact >> "$out" || true

          section 'Failed Tacho execution console logs'
          az containerapp job logs show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --execution "$TACHO_EXECUTION" --container tms-job --tail 200 2>&1 | redact >> "$out" || true

          section 'Recent Tacho executions'
          az containerapp job execution list --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query '[0:8].{name:name,status:properties.status,start:properties.startTime,end:properties.endTime}' -o json 2>&1 | redact >> "$out" || true

          section 'Recent ETA executions'
          az containerapp job execution list --name "$ETA_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query '[0:8].{name:name,status:properties.status,start:properties.startTime,end:properties.endTime}' -o json 2>&1 | redact >> "$out" || true
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-job-diagnostics.txt
          git commit -m 'Record production scheduled job diagnostics' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

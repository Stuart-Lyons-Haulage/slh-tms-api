name: CD - Deploy TMS scheduled jobs

on:
  workflow_run:
    workflows: ["CD - Deploy TMS to Azure Container Apps"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full tested commit SHA to deploy to scheduled jobs
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: slh-tms-jobs-production
  cancel-in-progress: true

jobs:
  deploy-jobs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CONTAINER_REGISTRY: slhtmsacrprod
      AZURE_RESOURCE_GROUP: slh-tms-prod-rg
      AZURE_CONTAINER_APP_NAME: slh-tms-api-prod
      AZURE_CONTAINER_APP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TACHO_JOB: slh-tms-job-tachomaster
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_sha="$(printf '%s' "$DEPLOY_SHA" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Scheduled jobs deployment requires a full 40-character commit SHA."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$deploy_sha" >/dev/null
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable scheduled-jobs image
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --file Slh.Tms.Jobs/Dockerfile \
            --image "slh-tms-jobs:$DEPLOY_SHA" \
            .

      - name: Reconcile TachoMaster scheduled job from production
        run: |
          set -euo pipefail
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/slh-tms-jobs:$DEPLOY_SHA"

          if ! az containerapp job show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "::error::$TACHO_JOB does not exist. Provision it before deploying; this workflow will not create an ungoverned production job."
            exit 1
          fi

          # Production API is the governed source for runtime integration credentials.
          # Re-read them on every deployment so the scheduled job cannot drift after a
          # TachoMaster/RoadTech credential rotation or environment configuration change.
          source_secrets="$(az containerapp secret list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --show-values \
            --output json)"

          secret_value() {
            jq -r --arg name "$1" '[.[] | select(.name == $name)][0].value // empty' <<<"$source_secrets"
          }

          tms_db="$(secret_value tms-db-connection)"
          dot_base="$(secret_value dot-base-url)"
          dot_api="$(secret_value dot-api-key)"
          dot_company="$(secret_value dot-company-code)"
          dot_user="$(secret_value dot-username)"
          dot_password="$(secret_value dot-password)"

          missing=()
          test -n "$tms_db" || missing+=(tms-db-connection)
          test -n "$dot_base" || missing+=(dot-base-url)
          test -n "$dot_api" || missing+=(dot-api-key)
          test -n "$dot_user" || missing+=(dot-username)
          test -n "$dot_password" || missing+=(dot-password)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Cannot reconcile TachoMaster job because production API secret(s) are unavailable: ${missing[*]}."
            exit 1
          fi

          secret_args=(
            "tms-db=$tms_db"
            "dot-base-url=$dot_base"
            "dot-api-key=$dot_api"
            "dot-username=$dot_user"
            "dot-password=$dot_password"
          )
          env_args=(
            "TMS_JOB_KIND=tachomaster"
            "ConnectionStrings__TmsDb=secretref:tms-db"
            "Tracking__Dot__Enabled=true"
            "Tracking__Dot__BaseUrl=secretref:dot-base-url"
            "Tracking__Dot__ApiKey=secretref:dot-api-key"
            "Tracking__Dot__Username=secretref:dot-username"
            "Tracking__Dot__Password=secretref:dot-password"
            "Integrations__TachoMaster__Enabled=true"
            "Integrations__TachoMaster__BaseUrl=secretref:dot-base-url"
            "Integrations__TachoMaster__ApiKey=secretref:dot-api-key"
            "Integrations__TachoMaster__Username=secretref:dot-username"
            "Integrations__TachoMaster__Password=secretref:dot-password"
          )
          if test -n "$dot_company"; then
            secret_args+=("dot-company-code=$dot_company")
            env_args+=("Tracking__Dot__CompanyCode=secretref:dot-company-code")
          fi

          az containerapp job secret set \
            --name "$TACHO_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${secret_args[@]}" \
            --output none

          az containerapp job update \
            --name "$TACHO_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$image" \
            --set-env-vars "${env_args[@]}" \
            --output none

          trigger="$(az containerapp job show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.triggerType --output tsv)"
          cron="$(az containerapp job show --name "$TACHO_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.scheduleTriggerConfig.cronExpression --output tsv)"
          test "$trigger" = "Schedule"
          test "$cron" = "*/5 * * * *"
          echo "Reconciled $TACHO_JOB with production secrets/environment; trigger=$trigger cron=$cron image=$image"

      - name: Run canonical TachoMaster sync immediately
        run: |
          set -euo pipefail
          execution="$(az containerapp job start \
            --name "$TACHO_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name \
            --output tsv)"
          echo "Started $execution"

          for attempt in {1..48}; do
            state="$(az containerapp job execution show \
              --name "$TACHO_JOB" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv 2>/dev/null || true)"
            echo "TachoMaster execution $execution status=${state:-unknown}"
            case "$state" in
              Succeeded) exit 0 ;;
              Failed) exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for immediate TachoMaster canonical sync."
          exit 1

      - name: Verify canonical Driver Master cleanse
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body="$(curl --silent --show-error --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/driver-master" || true)"
            echo "$body"
            member_dupes="$(jq -r '.duplicateMemberGroups // -1' <<<"$body" 2>/dev/null || echo -1)"
            card_dupes="$(jq -r '.duplicateCardGroups // -1' <<<"$body" 2>/dev/null || echo -1)"
            without_member="$(jq -r '.activeWithoutMember // -1' <<<"$body" 2>/dev/null || echo -1)"
            aligned="$(jq -r '.populationAligned // false' <<<"$body" 2>/dev/null || echo false)"
            latest="$(jq -r '.latestCanonicalSyncUtc // empty' <<<"$body" 2>/dev/null || true)"
            if test "$member_dupes" = "0" -a "$card_dupes" = "0" -a "$without_member" = "0" -a "$aligned" = "true" -a -n "$latest"; then
              echo "Canonical Driver Master is clean and aligned at $latest."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Canonical Driver Master did not reach clean/aligned state."
          exit 1

      - name: Verify scheduled sync freshness Boolean
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 45 \
            -H 'Cache-Control: no-cache' \
            "https://$AZURE_CONTAINER_APP_FQDN/api/v1/health/tachomaster")"
          echo "$body"
          stale="$(jq -r 'if .scheduledSync.stale == null then true else .scheduledSync.stale end' <<<"$body")"
          test "$stale" = "false"

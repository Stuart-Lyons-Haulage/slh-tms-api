name: Temporary delivery ETA durability repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary_delivery_eta_durability_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve durable geofence progression in delivery ETAs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('Controllers/OperationsController.cs')
          text = path.read_text()
          old = """            geofence = await EmbeddedGeofenceEngine.BuildAsync(db, planningDate, GeofencePlanningMatch.PrepareLoads(loads), ct);"""
          new = """            geofence = await EmbeddedGeofenceEngine.BuildAsync(db, planningDate, GeofencePlanningMatch.PrepareLoads(loads), ct);\n            // The in-memory RoadTech reconstruction can briefly be incomplete while a refresh is\n            // catching up. Merge the durable projection before calculating ETAs so already-proved\n            // stops cannot disappear and send the route backwards through completed work.\n            geofence = await EmbeddedGeofenceEvidenceMerge.MergeDurableProjectionAsync(db, geofence, loads, ct);"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected geofence build statement was not found')
          path.write_text(text)
          PY

      - name: Verify API
        shell: bash
        run: dotnet test --configuration Release

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Controllers/OperationsController.cs
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "Stabilise delivery ETAs with durable geofence evidence"
          git push origin HEAD:main

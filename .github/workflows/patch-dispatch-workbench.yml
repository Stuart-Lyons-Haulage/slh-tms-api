name: Patch dispatch planning workbench

on:
  push:
    branches:
      - fix/dispatch-planning-workbench

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dispatch-planning-workbench
          fetch-depth: 0
      - name: Apply dispatch API repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Controllers/DriverDispatchController.cs')
          s = p.read_text()
          if 'PreviousRoute,' in s and 'currentDayDriverIds.Contains(driver.Id)) return true;' in s:
              print('Dispatch API repair already applied')
              raise SystemExit(0)

          old = '''            if (persistedAgency) return operationallyRelevant;\n            if (sage.Available) return sageDriver;\n'''
          new = '''            // A current TMS allocation is operational truth for Dispatch visibility.\n            // Sage HR still supplies leave/availability, but a roster mismatch must never hide\n            // a driver who is already allocated to today's plan.\n            if (currentDayDriverIds.Contains(driver.Id)) return true;\n            if (persistedAgency) return operationallyRelevant;\n            if (sage.Available) return sageDriver;\n'''
          if old not in s:
              raise SystemExit('first Sage visibility block not found')
          s = s.replace(old, new, 1)

          old = '''            if (IsAgency(driver)) return operationallyRelevant;\n            if (sage.Available) return sageDriver;\n'''
          new = '''            if (currentDayDriverIds.Contains(driver.Id)) return true;\n            if (IsAgency(driver)) return operationallyRelevant;\n            if (sage.Available) return sageDriver;\n'''
          if old not in s:
              raise SystemExit('enriched Sage visibility block not found')
          s = s.replace(old, new, 1)

          old = '''            var previousFinal = previous?.Stops.OrderBy(stop => stop.Sequence).LastOrDefault();\n'''
          new = '''            var previousStops = previous?.Stops.OrderBy(stop => stop.Sequence).ToList() ?? [];\n            var previousFinal = previousStops.LastOrDefault();\n            var previousRoute = previousStops.Count == 0\n                ? null\n                : string.Join(" → ", previousStops.Select(stop => CleanStopName(stop.Name)));\n'''
          if old not in s:
              raise SystemExit('previous final block not found')
          s = s.replace(old, new, 1)

          old = '''                previousFinal?.Name,\n                previousFinal?.Latitude,\n                allocated.FirstOrDefault()?.Id,\n'''
          new = '''                previousFinal?.Name,\n                previousFinal?.Latitude,\n                previousRoute,\n                allocated.FirstOrDefault()?.Id,\n'''
          if old not in s:
              raise SystemExit('driver row previous fields block not found')
          s = s.replace(old, new, 1)

          old = '''    private static DateTimeOffset? FirstPlanned(Load load) => load.Stops.OrderBy(stop => stop.Sequence).Select(stop => stop.PlannedArrivalUtc).FirstOrDefault(value => value is not null);\n'''
          new = '''    private static DateTimeOffset? FirstPlanned(Load load) => load.Stops.OrderBy(stop => stop.Sequence).Select(stop => stop.PlannedArrivalUtc).FirstOrDefault(value => value is not null);\n    private static string CleanStopName(string? value)\n    {\n        if (string.IsNullOrWhiteSpace(value)) return "Stop";\n        var clean = value.Trim();\n        foreach (var prefix in new[] { "Collect · ", "Deliver · ", "Collect - ", "Deliver - " })\n            if (clean.StartsWith(prefix, StringComparison.OrdinalIgnoreCase)) return clean[prefix.Length..].Trim();\n        return clean;\n    }\n'''
          if old not in s:
              raise SystemExit('FirstPlanned helper marker not found')
          s = s.replace(old, new, 1)

          old = '''    string? PreviousFinalStop,\n    decimal? PreviousFinalLatitude,\n    Guid? AssignedLoadId,\n'''
          new = '''    string? PreviousFinalStop,\n    decimal? PreviousFinalLatitude,\n    string? PreviousRoute,\n    Guid? AssignedLoadId,\n'''
          if old not in s:
              raise SystemExit('DriverDispatchDriver record block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Controllers/DriverDispatchController.cs
          git commit -m "Keep allocated drivers visible and expose previous route"
          git push origin HEAD:fix/dispatch-planning-workbench

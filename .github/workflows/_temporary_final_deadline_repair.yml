name: Temporary final deadline repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary_final_deadline_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair final-customer deadline source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Controllers/OperationsController.cs')
          text = path.read_text()

          anchor = '            var finalDestination = RunFinalDestination.Select(load.Stops);\n'
          insertion = '''            var finalDestination = RunFinalDestination.Select(load.Stops);
            // The final customer promise comes from the transport-order delivery window,
            // not the planner arrival time for an intermediate/operational stop. Some
            // imported runs do not retain the OrderId on the final display stop, so carry
            // the latest explicit delivery window from the orders attached anywhere on
            // the run onto the selected final customer destination.
            var finalDeliveryWindowEndUtc = load.Stops
                .Select(stop => stop.OrderId is Guid orderId && orders.TryGetValue(orderId, out var linkedOrder)
                    ? linkedOrder.DeliveryWindowEndUtc
                    : null)
                .Where(value => value is not null)
                .OrderByDescending(value => value)
                .FirstOrDefault();
'''
          assert text.count(anchor) == 1, 'finalDestination anchor not found exactly once'
          text = text.replace(anchor, insertion, 1)

          old = '''                if (windowEnd is null && finalDestination is not null && stop.Id == finalDestination.Id)
                    windowEnd = finalDestination.PlannedArrivalUtc;'''
          new = '''                if (windowEnd is null && finalDestination is not null && stop.Id == finalDestination.Id)
                    windowEnd = finalDeliveryWindowEndUtc;'''
          assert old in text, 'planned-arrival deadline fallback not found'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Build and test repair
        shell: bash
        run: |
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj
          dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore

      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/_temporary_final_deadline_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Controllers/OperationsController.cs .github/workflows/_temporary_final_deadline_repair.yml
          git commit -m 'Use order delivery deadline for final ETA risk'
          git push origin HEAD:main

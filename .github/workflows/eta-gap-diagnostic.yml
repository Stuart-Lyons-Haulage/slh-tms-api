name: Diagnose ETA gaps

on:
  pull_request:
    paths:
      - '.github/workflows/eta-gap-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
      PLANNING_DATE: '2026-08-26'
    steps:
      - name: Inspect final ETA deadlines and wallboard risk inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_WALLBOARD_ACCESS_KEY"
          headers=(-H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY")

          timing_file="$(mktemp)"
          eta_file="$(mktemp)"

          timing_status="$(curl --silent --show-error --output "$timing_file" --write-out '%{http_code}' "${headers[@]}" "$API_BASE/api/v1/run-timing?date=$PLANNING_DATE")"
          eta_status="$(curl --silent --show-error --output "$eta_file" --write-out '%{http_code}' "${headers[@]}" "$API_BASE/api/v1/operations/delivery-etas?date=$PLANNING_DATE")"
          echo "timing=$timing_status etas=$eta_status"
          test "$timing_status" = "200"
          test "$eta_status" = "200"

          jq -n --slurpfile timing "$timing_file" --slurpfile etas "$eta_file" '
            ($timing[0].records // []) as $timingRecords |
            ($etas[0].records // []) as $etaRecords |
            [ $timingRecords[] as $t |
              ($etaRecords | map(select(.loadId == $t.loadId)) | sort_by(.sequence)) as $runEtas |
              ($runEtas[0] // null) as $first |
              ($runEtas[-1] // null) as $final |
              {
                loadReference: $t.loadReference,
                nextStopName: $t.nextStopName,
                nextEtaUtc: $t.nextEtaUtc,
                finalEtaUtc: $t.finalEtaUtc,
                nextDeadlineUtc: ($runEtas | map(select(.stopId == $t.nextStopId))[0].deliveryWindowEndUtc // $runEtas | map(select(.sequence == $t.nextStopSequence))[0].deliveryWindowEndUtc // null),
                finalStopName: ($final.stopName // null),
                finalStopEtaFromDeliveryFeedUtc: ($final.etaUtc // null),
                finalDeliveryWindowStartUtc: ($final.deliveryWindowStartUtc // null),
                finalDeliveryWindowEndUtc: ($final.deliveryWindowEndUtc // null),
                finalDeliveryRisk: ($final.risk // null),
                firstStopName: ($first.stopName // null),
                firstPlannedOrEtaUtc: ($first.etaUtc // null)
              }
            ]'

          rm -f "$timing_file" "$eta_file"

name: Diagnose ETA gaps

on:
  pull_request:
    paths:
      - '.github/workflows/eta-gap-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
      PLANNING_DATE: '2026-08-26'
    steps:
      - name: Inspect Run 23 Merston evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_WALLBOARD_ACCESS_KEY"
          headers=(-H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY")
          progress_file="$(mktemp)"
          health_file="$(mktemp)"

          progress_status="$(curl --silent --show-error --output "$progress_file" --write-out '%{http_code}' "${headers[@]}" "$API_BASE/api/v1/run-progress?date=$PLANNING_DATE")"
          health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' "${headers[@]}" "$API_BASE/api/v1/health/run-evidence?date=$PLANNING_DATE")"
          echo "runProgress=$progress_status runEvidence=$health_status"
          test "$progress_status" = "200"
          test "$health_status" = "200"

          jq -n --slurpfile progress "$progress_file" --slurpfile health "$health_file" '
            ($progress[0].records // []) as $runs |
            ($health[0].prioritySites // []) as $sites |
            {
              merstonPhysical: ($sites | map(select(.site == "NWF Merston"))[0] // null),
              run23: ($runs | map(select((.loadReference // "") | test("Run 23|PLAN-20260826-23"; "i")))[0] // null | if . == null then null else {
                loadId,
                loadReference,
                runState,
                completedStops,
                totalStops,
                nextStop,
                currentVisit,
                lastDeparture,
                stopDwell,
                linkageException
              } end)
            }'

          rm -f "$progress_file" "$health_file"

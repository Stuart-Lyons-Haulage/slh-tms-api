name: Duplicate Run Production Diagnostic

on:
  push:
    branches:
      - diag/duplicate-run-pairs-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
    steps:
      - name: Inspect production duplicate run pairs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_WALLBOARD_ACCESS_KEY"
          planning_date="$(TZ=Europe/London date +%F)"
          assignments="$(mktemp)"
          source="$(mktemp)"
          live="$(mktemp)"
          trap 'rm -f "$assignments" "$source" "$live"' EXIT

          curl --silent --show-error --max-time 60 \
            -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
            "$API_BASE/api/v1/driver-assignments?from=$planning_date&to=$planning_date" > "$assignments"

          curl --silent --show-error --max-time 60 \
            -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
            "$API_BASE/api/v1/operations/wallboard-source-health?date=$planning_date" > "$source"

          echo "planningDate=$planning_date"
          echo "driverAssignmentCount=$(jq 'length' "$assignments")"
          echo "--- assignments ---"
          jq -r '.[] | [(.loadId//""),(.planningDate//""),(.loadReference//""),(.status//""),(.driver.displayName//"Unallocated"),(.vehicle.registration//""),(.trailerNumber//""),(.stopCount|tostring)] | @tsv' "$assignments"
          echo "--- probable duplicate allocation signatures ---"
          jq -r 'group_by([(.driver.displayName//"Unallocated"),(.vehicle.registration//"")]) | map(select(length > 1)) | .[] | "PAIR\tdriver=\(.[0].driver.displayName//"Unallocated")\tvehicle=\(.[0].vehicle.registration//"")\tcount=\(length)\n" + (map("  id=\(.loadId) ref=\(.loadReference) status=\(.status) trailer=\(.trailerNumber//"-") stops=\(.stopCount)") | join("\n"))' "$assignments"
          echo "--- wallboard source health ---"
          jq . "$source"

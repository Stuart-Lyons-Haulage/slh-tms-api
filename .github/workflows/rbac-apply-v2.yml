name: Validate Entra RBAC

on:
  push:
    branches:
      - feature/entra-rbac
    paths:
      - .github/workflows/rbac-apply-v2.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entra-rbac
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj
      - name: Build API
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore
      - name: RBAC static assertions
        shell: bash
        run: |
          grep -q 'RoleClaimType = "roles"' Program.cs
          grep -q 'options.AddPolicy(TmsPolicies.Dispatch' Program.cs
          grep -q 'options.AddPolicy(TmsPolicies.MasterData' Program.cs
          grep -q 'options.AddPolicy(TmsPolicies.Admin' Program.cs
          ! grep -q 'options.AddPolicy("TmsWrite", tmsAccessPolicy)' Program.cs
          grep -R 'TmsDispatch' Controllers >/dev/null
          grep -R 'TmsMasterData' Controllers >/dev/null
          grep -R 'TmsAdmin' Controllers >/dev/null

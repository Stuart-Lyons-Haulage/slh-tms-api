name: Apply RBAC source transformation

on:
  push:
    branches:
      - feature/entra-rbac
    paths:
      - .github/workflows/rbac-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entra-rbac
          fetch-depth: 0
      - name: Harden operational anonymous endpoints
        run: python tools/harden-rbac-anonymous.py
      - name: Commit endpoint authorisation changes
        run: |
          git config user.name "slh-tms-rbac-bot"
          git config user.email "slh-tms-rbac-bot@users.noreply.github.com"
          git add Controllers
          git commit -m "Require TmsAccess for operational data feeds"
          git push origin HEAD:feature/entra-rbac

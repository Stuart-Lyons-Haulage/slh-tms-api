name: Apply Container Apps Jobs refactor

on:
  push:
    branches:
      - feature/container-app-integration-jobs
    paths:
      - scripts/apply-container-app-jobs-refactor.py
      - scripts/fix-container-app-jobs-usings.py
      - .github/workflows/apply-container-app-jobs-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/container-app-integration-jobs
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply guarded refactor
        run: |
          python scripts/apply-container-app-jobs-refactor.py
          python scripts/fix-container-app-jobs-usings.py
      - name: Restore and build API, jobs and tests
        run: |
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Jobs/Slh.Tms.Jobs.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj
          dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore
          dotnet build Slh.Tms.Jobs/Slh.Tms.Jobs.csproj --configuration Release --no-restore
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore
      - name: Commit refactor
        run: |
          git config user.name "slh-tms-jobs-bot"
          git config user.email "slh-tms-jobs-bot@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-container-app-jobs-refactor.yml scripts/apply-container-app-jobs-refactor.py scripts/fix-container-app-jobs-usings.py
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Move scheduled integrations to Container Apps Jobs"
          git push origin HEAD:feature/container-app-integration-jobs

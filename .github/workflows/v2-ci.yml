name: V2 CI

on:
  push:
    branches: [ "v2/foundation" ]
  pull_request:
    branches: [ "v2/foundation" ]

jobs:
  build-v2-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore v2/Slh.Tms.V2.Api/Slh.Tms.V2.Api.csproj
      - name: Build
        run: dotnet build v2/Slh.Tms.V2.Api/Slh.Tms.V2.Api.csproj -c Release --no-restore

name: Temporary Info Mailbox Intake Repair

on:
  push:
    branches:
      - fix/info-mailbox-precedence-categories-20260826
    paths:
      - .github/workflows/_temporary_info_mailbox_fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/info-mailbox-precedence-categories-20260826
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj

      - name: Add behavior tests
        run: python tools/_temporary_info_mailbox_fix.py tests

      - name: Prove red
        shell: bash
        run: |
          set +e
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ExplicitCollectFrom_OverridesSenderDomainCollectionMapping|FullyQualifiedName~ExplicitBodyDeliveryTo_OverridesConflictingSubjectDestination|FullyQualifiedName~MasterDataBodySignal_OverridesConflictingSubjectCustomer|FullyQualifiedName~BarfootsWaitroseWaveBody_StagesEveryWaveAsSeparateOrder|FullyQualifiedName~SainsburyImageLedTransportRequirements_AreEligibleForMappingReview'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected new tests to fail before implementation.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: Apply implementation
        run: python tools/_temporary_info_mailbox_fix.py implementation

      - name: Handle chained Barfoots waves
        shell: python
        run: |
          from pathlib import Path

          path = Path('Services/EmailOrderIntakeService.cs')
          text = path.read_text(encoding='utf-8')
          start_marker = '        var rows = Regex.Matches(\n                body,\n                @"(?<depot>Aylesford'
          end_marker = '        if (rows.Count == 0) return [];'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''        var waveMatches = Regex.Matches(
                body,
                @"(?<depot>Aylesford|Bracknell|Brinklow|Leyland)\s+WAVE\s+(?<wave>\d+)(?:\s+from\s+(?<collection>[A-Z][A-Z0-9 &'()/-]{1,80}?))?\s+(?<qty>\d{1,3})\s+pallets?\s+PO\s+(?<po>[A-Z0-9/-]+)",
                RegexOptions.IgnoreCase)
            .Cast<Match>()
            .ToList();
        var rows = new List<(string Depot, int Wave, string Collection, int Pallets, string Po)>();
        string? currentCollection = null;
        foreach (var match in waveMatches)
        {
            var statedCollection = match.Groups["collection"].Success
                ? CleanSourceLine(match.Groups["collection"].Value)
                : null;
            if (!string.IsNullOrWhiteSpace(statedCollection)) currentCollection = statedCollection;
            if (string.IsNullOrWhiteSpace(currentCollection)) continue;
            var pallets = int.Parse(match.Groups["qty"].Value, CultureInfo.InvariantCulture);
            if (pallets <= 0) continue;
            rows.Add((
                CultureInfo.InvariantCulture.TextInfo.ToTitleCase(match.Groups["depot"].Value.ToLowerInvariant()),
                int.Parse(match.Groups["wave"].Value, CultureInfo.InvariantCulture),
                currentCollection,
                pallets,
                match.Groups["po"].Value.Trim().ToUpperInvariant()));
        }
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Prove green
        run: |
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ExplicitCollectFrom_OverridesSenderDomainCollectionMapping|FullyQualifiedName~ExplicitBodyDeliveryTo_OverridesConflictingSubjectDestination|FullyQualifiedName~MasterDataBodySignal_OverridesConflictingSubjectCustomer|FullyQualifiedName~BarfootsWaitroseWaveBody_StagesEveryWaveAsSeparateOrder|FullyQualifiedName~SainsburyImageLedTransportRequirements_AreEligibleForMappingReview'
          python power-automate/info-mailbox-order-intake/test_validate_workflow.py
          python power-automate/info-mailbox-order-intake/validate_workflow.py
          dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temporary_info_mailbox_fix.yml tools/_temporary_info_mailbox_fix.py
          git add Services/EmailOrderIntakeService.cs Controllers/OrderIntakeController.cs Slh.Tms.Api.Tests/EmailOrderIntakeServiceTests.cs power-automate/info-mailbox-order-intake/workflow.json power-automate/info-mailbox-order-intake/validate_workflow.py power-automate/info-mailbox-order-intake/test_validate_workflow.py
          git commit -m 'Fix mailbox parsing precedence and result categories'
          git push origin HEAD:fix/info-mailbox-precedence-categories-20260826

name: Today Geofence Hit Diagnostic

on:
  push:
    branches: ['diagnostic/run2-geofence']
    paths:
      - '.github/workflows/today-geofence-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
    steps:
      - name: Capture production evidence
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          planning_date="$(TZ=Europe/London date +%F)"
          headers=(-H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" -H "X-TV-Display-Key: $TV_WALLBOARD_ACCESS_KEY")
          curl --fail --silent --show-error --max-time 120 "${headers[@]}" "$API_BASE/api/v1/loads?date=$planning_date" > /tmp/loads.json
          curl --fail --silent --show-error --max-time 120 "$API_BASE/api/v1/health/tracking/geofences" > /tmp/health.json
          curl --fail --silent --show-error --max-time 180 "${headers[@]}" "$API_BASE/api/v1/run-progress?date=$planning_date" > /tmp/progress.json
          jq -e . /tmp/loads.json >/dev/null
          jq -e . /tmp/health.json >/dev/null
          jq -e . /tmp/progress.json >/dev/null

      - name: Production has merged wallboard runs
        shell: bash
        run: test "$(jq 'length' /tmp/loads.json)" -gt 1

      - name: RoadTech historical tracking is stored
        shell: bash
        run: |
          test "$(jq -r '.storedTrackingEvents24h // 0' /tmp/health.json)" -gt 0
          test "$(jq -r '.latestStoredTrackingEventUtc // empty' /tmp/health.json)" != ""

      - name: Durable geofence visits exist
        shell: bash
        run: |
          test "$(jq -r '.vehiclesWithGeofenceEvidence24h // 0' /tmp/health.json)" -gt 0
          test "$(jq -r '.latestGeofenceEventUtc // empty' /tmp/health.json)" != ""

      - name: Run progress sees geofence linked runs
        shell: bash
        run: |
          test "$(jq -r '.geofenceLinkedRuns // 0' /tmp/progress.json)" -gt 0
          test "$(jq -r '.geofenceLinkedStops // 0' /tmp/progress.json)" -gt 0

      - name: Run progress has actual geofence hits
        shell: bash
        run: |
          test "$(jq -r '.geofenceHitRuns // 0' /tmp/progress.json)" -gt 0
          test "$(jq -r '.geofenceHitStops // 0' /tmp/progress.json)" -gt 0
          test "$(jq -r '.geofenceVisitCount // 0' /tmp/progress.json)" -gt 0

      - name: Run 2 exists in production progress
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i")))] | length > 0' /tmp/progress.json >/dev/null

      - name: Run 2 has a planned vehicle
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i"))) | select((.vehicleRegistration // "") != "")] | length > 0' /tmp/progress.json >/dev/null

      - name: Run 2 has durable stop visit history
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i"))) | (.stopDwell // [])[]? | select(.siteArrivalUtc != null or .siteDepartureUtc != null or .state == "OnSite" or .state == "Departed")] | length > 0' /tmp/progress.json >/dev/null

      - name: Run 2 has completed geofence stops
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i"))) | (.completedStops // 0)] | max > 0' /tmp/progress.json >/dev/null

      - name: Run 2 reflects at least five completed stops
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i"))) | (.completedStops // 0)] | max >= 5' /tmp/progress.json >/dev/null

      - name: Run 2 has no linkage exception
        shell: bash
        run: |
          jq -e '[.records[]? | select(((.loadReference // .reference // "") | test("(^|[[:space:]])run[[:space:]]*0*2$|^0*2$"; "i"))) | select(.linkageException != null)] | length == 0' /tmp/progress.json >/dev/null

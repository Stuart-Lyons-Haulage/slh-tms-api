name: One-shot - Apply reviewed TMS hardening

on:
  push:
    branches: [fix/review-hardening-20260909]
    paths:
      - .github/workflows/review-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.event.head_commit.message != 'Implement reviewed TMS hardening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/review-hardening-20260909

      - name: Apply reviewed code changes
        run: |
          set -euo pipefail
          python tools/prepatch-review-hardening-v2.py
          python tools/apply-review-hardening.py
          python tools/apply-review-hardening-fixups.py

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API and test projects
        run: |
          set -euo pipefail
          dotnet restore Slh.Tms.Api.csproj
          dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj

      - name: Build API release
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore

      - name: Run full API test suite
        run: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore

      - name: Commit verified hardening
        run: |
          set -euo pipefail
          rm -f tools/apply-review-hardening.py tools/apply-review-hardening-fixups.py tools/prepatch-review-hardening.py tools/prepatch-review-hardening-v2.py .github/workflows/review-hardening-apply.yml
          git config user.name "slh-tms-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement reviewed TMS hardening"
          git push origin HEAD:fix/review-hardening-20260909

      # This workflow removes itself after a verified commit; this comment only retriggers the one-shot gate.

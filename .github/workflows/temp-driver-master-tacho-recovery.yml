name: Temporary Driver Master Tacho recovery patch

on:
  push:
    branches:
      - fix/driver-master-tacho-sync-recovery-20260828

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/driver-master-tacho-sync-recovery-20260828
      - name: Apply repair
        run: python3 .github/driver-master-repair.py
      - name: Commit application repair
        run: |
          git checkout HEAD -- .github/workflows/driver-master-production-verification.yml
          rm .github/driver-master-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Driver Master Tacho sync and cleanse'
          git push origin HEAD:fix/driver-master-tacho-sync-recovery-20260828

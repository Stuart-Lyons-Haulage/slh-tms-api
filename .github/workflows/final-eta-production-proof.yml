name: Verify Final ETA production

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/final-eta-production-proof.yml'

permissions:
  contents: read

jobs:
  final-eta-proof:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
    steps:
      - name: Verify cumulative geofence final ETA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_WALLBOARD_ACCESS_KEY"
          body_file="$(mktemp)"
          progress_file="$(mktemp)"
          tv_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
            "$API_BASE/api/v1/run-timing" || true)"
          progress_status="$(curl --silent --show-error --output "$progress_file" --write-out '%{http_code}' \
            -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
            "$API_BASE/api/v1/run-progress" || true)"
          tv_status="$(curl --silent --show-error --output "$tv_file" --write-out '%{http_code}' \
            -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
            "$API_BASE/api/v1/tv-display/route-progress" || true)"
          echo "[Run timing] HTTP $status | [Run progress] HTTP $progress_status | [TV route] HTTP $tv_status"
          test "$status" = "200"
          test "$progress_status" = "200"

          summary="$(jq -c '{
            planningDate,
            calculatedAtUtc,
            geofenceAvailable,
            totalRuns: (.records | length),
            completedRuns: ([.records[] | select(.completed == true)] | length),
            runsWithDepartureAnchor: ([.records[] | select(.previousGeofenceDepartureUtc != null)] | length),
            runsWithNextEta: ([.records[] | select(.nextEtaUtc != null)] | length),
            runsWithFinalEta: ([.records[] | select(.finalEtaUtc != null)] | length),
            finalEtaSources: ([.records[] | select(.finalEtaUtc != null) | .finalEtaSource] | group_by(.) | map({source: .[0], count: length})),
            run6: ([.records[] | select((.loadReference // "") | test("Run 6"; "i")) | {
              loadReference,
              nextStopName,
              nextEtaUtc,
              finalEtaUtc,
              finalEtaSource,
              previousGeofenceDepartureUtc,
              currentGeofenceName,
              routeAnchorSource,
              evidenceGaps,
              preRouteDwellMinutes,
              etaLegs
            }] | first),
            missingAfterDeparture: [.records[] | select(.completed != true and .previousGeofenceDepartureUtc != null and .finalEtaUtc == null) | {
              loadReference,
              nextStopName,
              previousGeofenceDepartureUtc,
              currentGeofenceName,
              routeAnchorSource,
              evidenceGaps
            }]
          }' "$body_file")"
          echo "$summary" | jq .

          echo '--- Run 6 Operations progression ---'
          jq '[.records[] | select((.loadReference // "") | test("Run 6"; "i")) | {loadReference, runState, completedStops, totalStops, progressionFrontierSequence, nextStop, evidenceGaps, currentVisit, lastDeparture}]' "$progress_file"
          if test "$tv_status" = "200"; then
            echo '--- Run 6 TV route progression ---'
            jq '[.runs[] | select((.reference // "") | test("Run 6"; "i")) | {reference, completedStops, totalStops, progressionFrontierSequence, nextStopId, focusStop, phase, trackingSource: $source, trackingFresh, trackingMoving, speedKph, evidenceGaps, stops}]' --arg source "$(jq -r '.trackingSource // "unknown"' "$tv_file")" "$tv_file"
          fi

          {
            echo '### Production final ETA evidence'
            echo
            echo '```json'
            echo "$summary" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          available="$(jq -r '.geofenceAvailable // false' "$body_file")"
          departure_count="$(jq -r '[.records[] | select(.previousGeofenceDepartureUtc != null)] | length' "$body_file")"
          final_eta_count="$(jq -r '[.records[] | select(.finalEtaUtc != null)] | length' "$body_file")"
          test "$available" = "true"
          if test "$departure_count" -gt 0 && test "$final_eta_count" -eq 0; then
            echo "::error title=Final ETA unavailable::There are $departure_count run(s) with an authoritative geofence departure but none produced a cumulative final ETA."
            exit 1
          fi

          jq -r '.records[] | select(.completed != true and .previousGeofenceDepartureUtc != null and .finalEtaUtc == null) | "::warning title=Final ETA gap \(.loadReference)::Departure anchor exists but cumulative final ETA is still unavailable for next stop \(.nextStopName // "unknown")."' "$body_file"
          rm -f "$body_file" "$progress_file" "$tv_file"

name: Hotfix Email Site Master Alignment

on:
  push:
    paths:
      - '.github/workflows/hotfix-email-site-master-alignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch order promotion
        shell: python
        run: |
          from pathlib import Path

          path = Path('Services/StagingService.cs')
          text = path.read_text()

          marker = '''        var (movement, plannerReady) = await RecordOrderRevision(item, payload, reference, customerCode, ct);\n        if (!plannerReady) return;\n        TransportOrder? existing;\n'''
          replacement = '''        var (movement, plannerReady) = await RecordOrderRevision(item, payload, reference, customerCode, ct);\n        if (!plannerReady) return;\n        var siteAlignment = await OrderSiteMasterAlignment.ResolveAsync(db, payload, ct);\n        TransportOrder? existing;\n'''
          if marker not in text:
              raise SystemExit('PromoteOrder alignment marker not found')
          text = text.replace(marker, replacement)

          old = '''            db.TransportOrders.Add(new TransportOrder { SourceStagedImportId = sourceStagedImportId, SourceMovementId = movement.Id, Reference = ClipRequired(reference, 80), CustomerCode = ClipRequired(customerCode, 40), CollectionDate = collectionDate, DeliveryDate = deliveryDate, DeliveryWindowStartUtc = deliveryWindowStartUtc, DeliveryWindowEndUtc = deliveryWindowEndUtc, Pallets = IntOrNull(payload, "pallets"), SellerName = Clip(Text(payload, "sellerName"), 200), MarketName = Clip(Text(payload, "marketName"), 80), StallNumber = Clip(Text(payload, "stallNumber"), 200), DriverInstructions = Clip(Text(payload, "driverInstructions"), 1000), MapLink = Clip(Text(payload, "mapLink"), 1000) });\n'''
          new = '''            db.TransportOrders.Add(new TransportOrder { SourceStagedImportId = sourceStagedImportId, SourceMovementId = movement.Id, Reference = ClipRequired(reference, 80), CustomerCode = ClipRequired(customerCode, 40), CollectionDate = collectionDate, DeliveryDate = deliveryDate, DeliveryWindowStartUtc = deliveryWindowStartUtc, DeliveryWindowEndUtc = deliveryWindowEndUtc, Pallets = IntOrNull(payload, "pallets"), SellerName = Clip(siteAlignment.CollectionName ?? Text(payload, "sellerName"), 200), MarketName = Clip(Text(payload, "marketName"), 80), StallNumber = Clip(siteAlignment.DeliveryName ?? Text(payload, "stallNumber"), 200), DriverInstructions = Clip(siteAlignment.DriverInstructions ?? Text(payload, "driverInstructions"), 1000), MapLink = Clip(siteAlignment.DeliveryMapLink ?? Text(payload, "mapLink"), 1000) });\n'''
          if old not in text:
              raise SystemExit('New TransportOrder projection marker not found')
          text = text.replace(old, new)

          old = '''        else\n        {\n            if (existing.SourceStagedImportId is null) existing.SourceStagedImportId = item.Id;\n            existing.SourceMovementId ??= movement.Id;\n        }\n'''
          new = '''        else\n        {\n            if (existing.SourceStagedImportId is null) existing.SourceStagedImportId = item.Id;\n            existing.SourceMovementId ??= movement.Id;\n            existing.Pallets = IntOrNull(payload, "pallets") ?? existing.Pallets;\n            existing.SellerName = Clip(siteAlignment.CollectionName ?? Text(payload, "sellerName") ?? existing.SellerName, 200);\n            existing.MarketName = Clip(Text(payload, "marketName") ?? existing.MarketName, 80);\n            existing.StallNumber = Clip(siteAlignment.DeliveryName ?? Text(payload, "stallNumber") ?? existing.StallNumber, 200);\n            existing.DriverInstructions = Clip(siteAlignment.DriverInstructions ?? Text(payload, "driverInstructions") ?? existing.DriverInstructions, 1000);\n            existing.MapLink = Clip(siteAlignment.DeliveryMapLink ?? Text(payload, "mapLink") ?? existing.MapLink, 1000);\n        }\n'''
          if old not in text:
              raise SystemExit('Existing TransportOrder projection marker not found')
          text = text.replace(old, new)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "SLH TMS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Services/StagingService.cs
          git diff --cached --quiet && exit 0
          git commit -m "Align email orders through Site Master before planning"
          git push origin main

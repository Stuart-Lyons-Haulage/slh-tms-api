name: Canonical planning integration

on:
  push:
    branches:
      - feature/canonical-relational-planning
    paths:
      - .github/workflows/canonical-planning-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-relational-planning
      - name: Register canonical schema in versioned migration catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'danwilliams201302-max'
          git config user.email 'daniel@lyonshaulage.com'
          test -f Migrations/Sql/20260831214900_CanonicalRelationalPlanning.sql
          cp Migrations/Sql/20260831214900_CanonicalRelationalPlanning.sql Database/039_Canonical_Relational_Planning.sql
          python - <<'PY'
          from pathlib import Path

          runner = Path('Services/SchemaMigrationRunner.cs')
          text = runner.read_text()
          old = '        "038_Driver_Tacho_Identity_Repair.sql"\n    ];'
          new = '        "038_Driver_Tacho_Identity_Repair.sql",\n        "039_Canonical_Relational_Planning.sql"\n    ];'
          if '"039_Canonical_Relational_Planning.sql"' not in text:
              if old not in text:
                  raise SystemExit('SchemaMigrationRunner append marker not found')
              text = text.replace(old, new, 1)
          runner.write_text(text)

          tests = Path('Slh.Tms.Api.Tests/SchemaResourceTests.cs')
          text = tests.read_text()
          resource_marker = '        Assert.Contains("Slh.Tms.Api.Database.038_Driver_Tacho_Identity_Repair.sql", resources);\n'
          resource_add = resource_marker + '        Assert.Contains("Slh.Tms.Api.Database.039_Canonical_Relational_Planning.sql", resources);\n'
          if 'Slh.Tms.Api.Database.039_Canonical_Relational_Planning.sql' not in text:
              if resource_marker not in text:
                  raise SystemExit('Schema resource assertion marker not found')
              text = text.replace(resource_marker, resource_add, 1)
          text = text.replace('        Assert.Equal(43, migrations.Count);', '        Assert.Equal(44, migrations.Count);')
          old_tail = '        Assert.Equal("037_Driver_Tacho_Identity.sql", migrations[^2].Name);\n        Assert.Equal("038_Driver_Tacho_Identity_Repair.sql", migrations[^1].Name);'
          new_tail = '        Assert.Equal("037_Driver_Tacho_Identity.sql", migrations[^3].Name);\n        Assert.Equal("038_Driver_Tacho_Identity_Repair.sql", migrations[^2].Name);\n        Assert.Equal("039_Canonical_Relational_Planning.sql", migrations[^1].Name);'
          if '039_Canonical_Relational_Planning.sql", migrations[^1]' not in text:
              if old_tail not in text:
                  raise SystemExit('Schema migration tail assertions not found')
              text = text.replace(old_tail, new_tail, 1)
          tests.write_text(text)
          PY
          rm .github/workflows/canonical-planning-integration.yml
          git add -A
          git commit -m 'Register canonical planning as schema migration 44'
          git push origin HEAD:feature/canonical-relational-planning

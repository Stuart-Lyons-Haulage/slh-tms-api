name: Temporary dispatch lock patch

on:
  push:
    branches:
      - fix/dispatch-direct-lock-recalc-20260910-api

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dispatch-direct-lock-recalc-20260910-api
          fetch-depth: 0
      - name: Patch DispatchService concurrency
        shell: python
        run: |
          from pathlib import Path
          p = Path('Services/DispatchService.cs')
          s = p.read_text()

          old = '''        var profilesTask = ReadDriverMasterProfilesAsync(drivers, ct);\n        var dutiesTask = ReadDutiesAsync(planningDate, ct);\n        var runProfilesTask = ReadRunProfilesAsync(planningDate, ct);\n        var liveTask = ReadLiveStatusesAsync(ct);\n        var historyTask = ReadRecentHistoryAsync(planningDate, ct);\n\n        await Task.WhenAll(profilesTask, dutiesTask, runProfilesTask, liveTask, historyTask);\n        var profiles = profilesTask.Result;\n        var duties = dutiesTask.Result;\n        var runProfiles = runProfilesTask.Result;\n        var liveStatuses = liveTask.Result;\n        var history = historyTask.Result;'''
          new = '''        // TmsDbContext is scoped and must not execute concurrent EF operations.\n        // Keep these reads sequential so Dispatch cannot intermittently fail with\n        // \"A second operation was started on this context\" under load.\n        var profiles = await ReadDriverMasterProfilesAsync(drivers, ct);\n        var duties = await ReadDutiesAsync(planningDate, ct);\n        var runProfiles = await ReadRunProfilesAsync(planningDate, ct);\n        var liveStatuses = await ReadLiveStatusesAsync(ct);\n        var history = await ReadRecentHistoryAsync(planningDate, ct);'''
          if old not in s:
              raise SystemExit('GetDrivers concurrency block not found')
          s = s.replace(old, new, 1)

          old = '''        var profilesTask = ReadDriverMasterProfilesAsync(drivers, ct);\n        var dutiesTask = ReadDutiesAsync(request.PlanningDate, ct);\n        await Task.WhenAll(profilesTask, dutiesTask);\n        var profiles = profilesTask.Result;\n        var duties = dutiesTask.Result;'''
          new = '''        // Do not parallelise EF-backed reads on the scoped TmsDbContext.\n        var profiles = await ReadDriverMasterProfilesAsync(drivers, ct);\n        var duties = await ReadDutiesAsync(request.PlanningDate, ct);'''
          if old not in s:
              raise SystemExit('AvailableTimes concurrency block not found')
          s = s.replace(old, new, 1)

          old = '''        var profilesTask = ReadDriverMasterProfilesAsync(drivers, ct);\n        var dutiesTask = ReadDutiesAsync(request.PlanningDate, ct);\n        var runsTask = ReadRunProfilesAsync(request.PlanningDate, ct);\n        var vehiclesTask = db.Vehicles.AsNoTracking().Where(vehicle => vehicle.Active && vehicleIds.Contains(vehicle.Id)).ToDictionaryAsync(vehicle => vehicle.Id, ct);\n        var trailersTask = db.Trailers.AsNoTracking().Where(trailer => trailer.Active && trailerIds.Contains(trailer.Id)).ToDictionaryAsync(trailer => trailer.Id, ct);\n        await Task.WhenAll(profilesTask, dutiesTask, runsTask, vehiclesTask, trailersTask);\n\n        var profiles = profilesTask.Result;\n        var duties = dutiesTask.Result;\n        var runs = runsTask.Result.ToDictionary(profile => profile.Dto.RunId);\n        var vehicleById = vehiclesTask.Result;\n        var trailerById = trailersTask.Result;'''
          new = '''        // Lock is an operational write path: every EF-backed read must complete before\n        // another query starts on this scoped DbContext. Parallel Task.WhenAll here\n        // caused the live HTTP 500 seen when Dispatch attempted a single-row lock.\n        var profiles = await ReadDriverMasterProfilesAsync(drivers, ct);\n        var duties = await ReadDutiesAsync(request.PlanningDate, ct);\n        var runProfiles = await ReadRunProfilesAsync(request.PlanningDate, ct);\n        var vehicleById = await db.Vehicles.AsNoTracking()\n            .Where(vehicle => vehicle.Active && vehicleIds.Contains(vehicle.Id))\n            .ToDictionaryAsync(vehicle => vehicle.Id, ct);\n        var trailerById = await db.Trailers.AsNoTracking()\n            .Where(trailer => trailer.Active && trailerIds.Contains(trailer.Id))\n            .ToDictionaryAsync(trailer => trailer.Id, ct);\n        var runs = runProfiles.ToDictionary(profile => profile.Dto.RunId);'''
          if old not in s:
              raise SystemExit('Lock concurrency block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Remove temporary marker files
        run: |
          rm -f docs/dispatch-lock-fix-note.tmp docs/dispatch-lock-fix-note-branch.tmp
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/DispatchService.cs docs/dispatch-lock-fix-note.tmp docs/dispatch-lock-fix-note-branch.tmp || true
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Fix Dispatch lock DbContext concurrency"
          git push origin HEAD:fix/dispatch-direct-lock-recalc-20260910-api

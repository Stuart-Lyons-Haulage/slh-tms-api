name: One-shot - Repair production jobs via ARM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-jobs-repair-arm.yml'

permissions:
  contents: write
  id-token: write

env:
  RG: slh-tms-prod-rg
  API_APP: slh-tms-api-prod
  API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
  TACHO: slh-tms-job-tachomaster
  ETA: slh-tms-job-eta
  IMAGE: slhtmsacrprod.azurecr.io/slh-tms-jobs:1e97a0e7b241f1c917f94c527f805b59728fa581

jobs:
  repair-arm:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Patch Tacho image and create ETA with ARM-safe identity
        shell: bash
        run: |
          set -euo pipefail
          api_secrets="$(az containerapp secret list -n "$API_APP" -g "$RG" --show-values -o json)"
          sval() { jq -r --arg n "$1" '[.[]|select(.name==$n)][0].value // empty' <<<"$api_secrets"; }
          db="$(sval tms-db-connection)"
          tv="$(sval tv-wallboard-access-key)"
          test -n "$db" -a -n "$tv"

          tacho="$(az containerapp job show -n "$TACHO" -g "$RG" -o json)"
          tacho_id="$(jq -r '.id' <<<"$tacho")"
          # PATCH only the image. This preserves the already-reconciled secrets/env/identity and
          # avoids the CLI serialising read-only clientId/principalId values back to ARM.
          patch="$(jq -n --arg image "$IMAGE" '{properties:{template:{containers:[{name:"slh-tms-job-tachomaster",image:$image}]}}}')"
          az rest --method patch --url "https://management.azure.com${tacho_id}?api-version=2024-03-01" --body "$patch" -o none

          # Re-read after patch. Build a create payload for ETA from the proven Tacho environment,
          # registry and execution configuration, but sanitise userAssignedIdentities values to {}.
          tacho="$(az containerapp job show -n "$TACHO" -g "$RG" -o json)"
          mi_client="$(jq -r '.identity.userAssignedIdentities | to_entries[0].value.clientId // empty' <<<"$tacho")"
          if grep -qi 'Authentication=Active Directory Managed Identity' <<<"$db" && test -n "$mi_client"; then
            db="$(printf '%s' "$db" | sed -E 's/(^|;)[[:space:]]*[Uu]ser[[:space:]]+[Ii][Dd]=[^;]*//g')"
            db="${db%;};User Id=${mi_client};"
          fi

          sub="$(az account show --query id -o tsv)"
          eta_url="https://management.azure.com/subscriptions/$sub/resourceGroups/$RG/providers/Microsoft.App/jobs/$ETA?api-version=2024-03-01"
          eta_body="$(jq -n --argjson src "$tacho" --arg image "$IMAGE" --arg db "$db" --arg tv "$tv" --arg api "$API_BASE" '
            {
              location:$src.location,
              identity:{type:$src.identity.type,userAssignedIdentities:($src.identity.userAssignedIdentities|with_entries(.value={}))},
              properties:{
                environmentId:$src.properties.environmentId,
                workloadProfileName:$src.properties.workloadProfileName,
                configuration:{
                  triggerType:"Schedule",
                  replicaTimeout:600,
                  replicaRetryLimit:1,
                  scheduleTriggerConfig:{cronExpression:"*/5 * * * *",parallelism:1,replicaCompletionCount:1},
                  registries:$src.properties.configuration.registries,
                  secrets:[{name:"tms-db",value:$db},{name:"wallboard-key",value:$tv}]
                },
                template:{containers:[{
                  name:"slh-tms-job-eta",
                  image:$image,
                  resources:$src.properties.template.containers[0].resources,
                  env:[
                    {name:"TMS_JOB_KIND",value:"eta"},
                    {name:"ConnectionStrings__TmsDb",secretRef:"tms-db"},
                    {name:"TmsApi__BaseUrl",value:$api},
                    {name:"TvWallboard__AccessKey",secretRef:"wallboard-key"}
                  ]
                }]}
              }
            }')"
          az rest --method put --url "$eta_url" --body "$eta_body" -o none

          az containerapp job show -n "$TACHO" -g "$RG" --query '{state:properties.provisioningState,image:properties.template.containers[0].image,cron:properties.configuration.scheduleTriggerConfig.cronExpression}' -o json
          az containerapp job show -n "$ETA" -g "$RG" --query '{state:properties.provisioningState,image:properties.template.containers[0].image,cron:properties.configuration.scheduleTriggerConfig.cronExpression,envNames:properties.template.containers[0].env[].name}' -o json

      - name: Execute Tacho and ETA immediately
        shell: bash
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" exec state
            exec="$(az containerapp job start -n "$job" -g "$RG" --query name -o tsv)"
            echo "Started $job execution $exec"
            for n in $(seq 1 90); do
              state="$(az containerapp job execution show -n "$job" -g "$RG" --job-execution-name "$exec" --query properties.status -o tsv 2>/dev/null || true)"
              echo "$job status=${state:-unknown}"
              case "$state" in Succeeded) return 0;; Failed) return 1;; esac
              sleep 10
            done
            return 2
          }
          wait_job "$TACHO"
          wait_job "$ETA"

      - name: Capture final job and Driver Master state
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          driver="$(curl -sS --max-time 60 -H 'Cache-Control: no-cache' "$API_BASE/api/v1/health/driver-master" || echo '{}')"
          tacho="$(curl -sS --max-time 60 -H 'Cache-Control: no-cache' "$API_BASE/api/v1/health/tachomaster" || echo '{}')"
          tj="$(az containerapp job show -n "$TACHO" -g "$RG" --query '{state:properties.provisioningState,image:properties.template.containers[0].image,cron:properties.configuration.scheduleTriggerConfig.cronExpression}' -o json 2>/dev/null || echo '{}')"
          ej="$(az containerapp job show -n "$ETA" -g "$RG" --query '{state:properties.provisioningState,image:properties.template.containers[0].image,cron:properties.configuration.scheduleTriggerConfig.cronExpression}' -o json 2>/dev/null || echo '{}')"
          jq -n --arg checked "$(date -u +%FT%TZ)" --argjson driver "$driver" --argjson tacho "$tacho" --argjson tachoJob "$tj" --argjson etaJob "$ej" '{checkedAtUtc:$checked,driverMaster:$driver,tachomaster:$tacho,tachoJob:$tachoJob,etaJob:$etaJob}' > diagnostics/production-jobs-arm-verification.json
      - name: Commit final state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f diagnostics/production-jobs-arm-verification.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/production-jobs-arm-verification.json
          git commit -m 'Record ARM production jobs repair state' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Enforce canonical readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=diagnostics/production-jobs-arm-verification.json
          test "$(jq -r '.driverMaster.duplicateMemberGroups // -1' "$f")" = 0
          test "$(jq -r '.driverMaster.duplicateCardGroups // -1' "$f")" = 0
          test "$(jq -r '.driverMaster.activeWithoutMember // -1' "$f")" = 0
          test "$(jq -r '.driverMaster.populationAligned // false' "$f")" = true
          test "$(jq -r 'if .tachomaster.scheduledSync.stale == null then true else .tachomaster.scheduledSync.stale end' "$f")" = false
          test "$(jq -r '.tachoJob.state // empty' "$f")" = Succeeded
          test "$(jq -r '.etaJob.state // empty' "$f")" = Succeeded

name: RBAC controller inventory

on:
  push:
    branches:
      - feature/entra-rbac

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory controller authorisation
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in sorted(Path('Controllers').glob('*.cs')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              controller_auth = []
              for i, line in enumerate(lines):
                  if 'class ' in line and 'Controller' in line:
                      for j in range(max(0, i-6), i):
                          if 'Authorize' in lines[j] or 'AllowAnonymous' in lines[j]:
                              controller_auth.append(lines[j].strip())
                      break
              print(f'\n### {path.name}')
              print('CONTROLLER:', ' | '.join(controller_auth) or '(none)')
              pending = []
              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith('['):
                      pending.append(stripped)
                      continue
                  if re.search(r'public\s+(?:async\s+)?(?:Task<)?IActionResult|public\s+(?:async\s+)?Task<|public\s+IResult', stripped):
                      http = [x for x in pending if re.search(r'Http(Get|Post|Put|Patch|Delete)', x)]
                      auth = [x for x in pending if 'Authorize' in x or 'AllowAnonymous' in x]
                      if http:
                          sig = stripped[:180]
                          print('METHOD:', ' | '.join(http), 'AUTH:', ' | '.join(auth) or '(inherits)', 'SIG:', sig)
                      pending = []
                  elif stripped and not stripped.startswith('//') and not stripped.startswith('['):
                      if not stripped.startswith(('public sealed record','public record','public class','private','internal','protected','namespace','using')):
                          pending = []

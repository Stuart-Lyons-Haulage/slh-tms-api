name: Full Production Health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/full-production-health.yml'
  workflow_run:
    workflows:
      - 'CD - Deploy TMS to Azure Container Apps'
    types: [completed]

permissions:
  contents: read

jobs:
  production-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      API_BASE: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      PORTAL_BASE: https://slh-tms-portal-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
      TV_WALLBOARD_ACCESS_KEY: ${{ secrets.TV_WALLBOARD_ACCESS_KEY }}
    steps:
      - name: Verify API, SQL, schema and live integrations
        shell: bash
        run: |
          set -euo pipefail

          probe_200() {
            local label="$1"
            local url="$2"
            local body_file
            body_file="$(mktemp)"
            for attempt in {1..18}; do
              status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" "$url" || true)"
              echo "[$label] HTTP $status"
              cat "$body_file" || true
              echo
              if test "$status" = "200"; then
                rm -f "$body_file"
                return 0
              fi
              sleep 10
            done
            rm -f "$body_file"
            echo "$label did not become healthy."
            return 1
          }

          probe_tachomaster() {
            local body_file
            body_file="$(mktemp)"
            for attempt in {1..18}; do
              status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" "$API_BASE/api/v1/health/tachomaster" || true)"
              echo "[TachoMaster] HTTP $status"
              cat "$body_file" || true
              echo
              if test "$status" = "200"; then
                if grep -Eq '"stale"[[:space:]]*:[[:space:]]*true' "$body_file"; then
                  freshness="$(grep -oE '"sourceFreshness"[[:space:]]*:[[:space:]]*"[^"]+"' "$body_file" | head -1 || true)"
                  age="$(grep -oE '"sourceAgeMinutes"[[:space:]]*:[[:space:]]*[0-9.]+' "$body_file" | head -1 || true)"
                  echo "::warning title=TachoMaster source freshness::TachoMaster is reachable and returned data, but its newest provider evidence is stale. ${freshness:-sourceFreshness unknown}; ${age:-sourceAgeMinutes unknown}."
                  {
                    echo "### Production health advisory"
                    echo "- ⚠️ TachoMaster endpoint is reachable, but the newest source evidence is stale (${freshness:-freshness unknown}; ${age:-age unknown})."
                    echo "- This is an advisory, not a hard outage: duty/event timestamps can remain unchanged when no new tachograph event is produced."
                  } >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "- ✅ TachoMaster source freshness is within the health threshold." >> "$GITHUB_STEP_SUMMARY"
                fi
                rm -f "$body_file"
                return 0
              fi
              sleep 10
            done
            rm -f "$body_file"
            echo "TachoMaster did not become reachable."
            return 1
          }

          probe_run_evidence() {
            test -n "$TV_WALLBOARD_ACCESS_KEY"
            local body_file
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" \
              -H "X-TMS-TV-Key: $TV_WALLBOARD_ACCESS_KEY" \
              "$API_BASE/api/v1/health/run-evidence" || true)"
            echo "[Cross-system run evidence] HTTP $status"
            test "$status" = "200"

            summary="$(jq -c '{
              planningDate,
              tracking: {
                observationCount: .tracking.observationCount,
                latestTrackingUtc: .tracking.latestTrackingUtc,
                plannedVehicleCount: .tracking.plannedVehicleCount,
                vehiclesWithMultipleSamples: .tracking.vehiclesWithMultipleSamples,
                vehiclesWithSingleSample: .tracking.vehiclesWithSingleSample,
                vehiclesWithNoSamples: .tracking.vehiclesWithNoSamples
              },
              geofences,
              tacho,
              prioritySites,
              evidenceGapCount
            }' "$body_file")"
            echo "$summary"
            {
              echo "### Cross-system run evidence"
              echo
              echo '```json'
              echo "$summary" | jq .
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            observations="$(jq -r '.tracking.observationCount // 0' "$body_file")"
            planned="$(jq -r '.geofences.plannedRuns // 0' "$body_file")"
            provider_evidence="$(jq -r '.tacho.providerEvidenceRecords // 0' "$body_file")"
            if test "$planned" -gt 0 && test "$observations" -lt "$planned"; then
              echo "::warning title=RoadTech operating-day evidence::Only $observations tracking observations were available for $planned planned runs. Geofence completion/ETA confidence may be incomplete."
            fi
            if test "$planned" -gt 0 && test "$provider_evidence" -eq 0; then
              echo "::warning title=Tacho run evidence::No live TachoMaster duty or Falcon driver-card evidence was returned for $planned planned runs."
            fi
            jq -r '.prioritySites[] | select(.plannedStops > 0 and .visits == 0) | "::warning title=Geofence evidence \(.site)::\(.plannedStops) planned stop(s) but zero reconstructed visits today."' "$body_file"
            rm -f "$body_file"
          }

          probe_200 'Core API' "$API_BASE/api/v1/health"
          probe_200 'Azure SQL' "$API_BASE/api/v1/health/ready"
          probe_200 'Operational data/schema' "$API_BASE/api/v1/diagnostics/data-readiness"
          probe_200 'RoadTech current GPS' "$API_BASE/api/v1/health/tracking"
          if test "$GITHUB_EVENT_NAME" != "pull_request"; then
            probe_200 'Vehicle geofence coverage' "$API_BASE/api/v1/health/tracking/geofences"
          fi
          probe_tachomaster
          probe_200 'Falcon geofence payload' "$API_BASE/api/v1/health/geofences"
          if test "$GITHUB_EVENT_NAME" != "pull_request"; then
            probe_200 'Planner and import data path' "$API_BASE/api/v1/health/planner-import"
            probe_run_evidence
          fi
          probe_200 'Portal' "$PORTAL_BASE/"

      - name: Verify protected operational routes fail closed
        shell: bash
        run: |
          set -euo pipefail

          expect_auth() {
            local label="$1"
            local method="$2"
            local url="$3"
            local data="${4:-}"
            if test "$method" = "POST"; then
              status="$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' --data "$data" "$url")"
            else
              status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$url")"
            fi
            echo "[$label] HTTP $status"
            test "$status" = "401" -o "$status" = "403"
          }

          expect_auth 'Customers' GET "$API_BASE/api/v1/customers"
          expect_auth 'Planner import' POST "$API_BASE/api/v1/planning/import-plan" '{}'
          expect_auth 'Info mailbox preview' POST "$API_BASE/api/v1/order-intake/email/preview" '{}'

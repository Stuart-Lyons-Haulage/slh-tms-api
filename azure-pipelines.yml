name: slh-tms-api-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - '*'

variables:
  - group: slh-tms-prod
  - name: buildConfiguration
    value: Release
  - name: azureServiceConnection
    value: slh-tms-prod-azure
  - name: azureSubscriptionId
    value: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3
  - name: azureLocation
    value: uksouth
  - name: resourceGroupName
    value: slh-tms-prod-rg
  - name: appServicePlanName
    value: slh-tms-b1-uksouth-plan
  - name: apiWebAppName
    value: slh-tms-api-prod
  - name: portalWebAppName
    value: slh-tms-portal-prod
  - name: keyVaultName
    value: slh-tms-kv-prod
  - name: entraTenantId
    value: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
  - name: entraAudience
    value: api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2
  - name: apiHealthUrl
    value: https://$(apiWebAppName).azurewebsites.net/api/v1/health
  - name: apiReadyUrl
    value: https://$(apiWebAppName).azurewebsites.net/api/v1/health/ready

stages:
  - stage: BuildAndTest
    displayName: Build and test API
    jobs:
      - job: Build
        displayName: Build .NET 8 API
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 8 SDK
            inputs:
              packageType: sdk
              version: 8.0.x

          - task: Cache@2
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(HOME)/.nuget/packages

          - script: |
              dotnet restore Slh.Tms.Api.csproj
              dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj
            displayName: Restore dependencies

          - script: dotnet build Slh.Tms.Api.csproj --configuration $(buildConfiguration) --no-restore
            displayName: Build API

          - script: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration $(buildConfiguration) --no-restore --logger trx --results-directory $(Agent.TempDirectory)/test-results
            displayName: Run API tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'

          - script: dotnet publish Slh.Tms.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish /p:UseAppHost=false
            displayName: Publish API package

          - task: ArchiveFiles@2
            displayName: Create deployable zip
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/slh-tms-api.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/slh-tms-api.zip
            displayName: Publish API artifact
            artifact: slh-tms-api

  - stage: DeployProduction
    displayName: Deploy API to UK South B1 App Service
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployApi
        displayName: Deploy API
        pool:
          vmImage: ubuntu-latest
        environment: slh-tms-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: slh-tms-api

                - task: AzureCLI@2
                  displayName: Ensure UK South B1 App Service exists
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az account set --subscription "$(azureSubscriptionId)"
                      az group create --name "$(resourceGroupName)" --location "$(azureLocation)" --only-show-errors
                      if ! az appservice plan show --name "$(appServicePlanName)" --resource-group "$(resourceGroupName)" >/dev/null 2>&1; then
                        az appservice plan create --name "$(appServicePlanName)" --resource-group "$(resourceGroupName)" --location "$(azureLocation)" --sku B1 --is-linux --only-show-errors
                      fi
                      if ! az webapp show --name "$(apiWebAppName)" --resource-group "$(resourceGroupName)" >/dev/null 2>&1; then
                        az webapp create --name "$(apiWebAppName)" --resource-group "$(resourceGroupName)" --plan "$(appServicePlanName)" --runtime "DOTNETCORE:8.0" --assign-identity --only-show-errors
                      else
                        az webapp identity assign --name "$(apiWebAppName)" --resource-group "$(resourceGroupName)" --only-show-errors
                      fi
                      az webapp config set --name "$(apiWebAppName)" --resource-group "$(resourceGroupName)" --linux-fx-version "DOTNETCORE|8.0" --always-on true --ftps-state Disabled --min-tls-version 1.2 --generic-configurations '{"healthCheckPath":"/api/v1/health"}' --only-show-errors

                - task: AzureCLI@2
                  displayName: Configure API App Service settings
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      key_vault_uri="https://$(keyVaultName).vault.azure.net"
                      az webapp config appsettings set \
                        --name "$(apiWebAppName)" \
                        --resource-group "$(resourceGroupName)" \
                        --settings \
                          "WEBSITE_RUN_FROM_PACKAGE=1" \
                          "Deployment__Revision=$(Build.SourceVersion)" \
                          "Entra__TenantId=$(entraTenantId)" \
                          "Entra__Audience=$(entraAudience)" \
                          "Cors__AllowedOrigins__0=https://$(portalWebAppName).azurewebsites.net" \
                          "ConnectionStrings__TmsDb=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-tms-db-connection/)" \
                          "Tracking__Dot__Enabled=true" \
                          "Tracking__Dot__BaseUrl=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-base-url/)" \
                          "Tracking__Dot__ApiKey=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-api-key/)" \
                          "Tracking__Dot__CompanyCode=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-company-code/)" \
                          "Tracking__Dot__Username=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-username/)" \
                          "Tracking__Dot__Password=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-password/)" \
                          "Integrations__TachoMaster__Enabled=true" \
                          "Integrations__TachoMaster__BaseUrl=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-base-url/)" \
                          "Integrations__TachoMaster__ApiKey=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-api-key/)" \
                          "Integrations__TachoMaster__Username=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-username/)" \
                          "Integrations__TachoMaster__Password=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-dot-password/)" \
                          "Integrations__SageHr__Enabled=true" \
                          "Integrations__SageHr__BaseUrl=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-sagehr-base-url/)" \
                          "Integrations__SageHr__ApiKey=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-sagehr-api-key/)" \
                          "TvWallboard__AccessKey=@Microsoft.KeyVault(SecretUri=${key_vault_uri}/secrets/slh-tv-wallboard-access-key/)" \
                        --only-show-errors

                - task: AzureWebApp@1
                  displayName: Deploy API zip to App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(apiWebAppName)
                    package: $(Pipeline.Workspace)/slh-tms-api/slh-tms-api.zip
                    runtimeStack: DOTNETCORE|8.0

                - script: |
                    set -euo pipefail
                    for attempt in {1..24}; do
                      health="$(curl --fail --silent --show-error "$(apiHealthUrl)" || true)"
                      echo "$health"
                      if echo "$health" | grep --quiet "$(Build.SourceVersion)"; then exit 0; fi
                      sleep 10
                    done
                    exit 1
                  displayName: Verify deployed API revision

                - script: |
                    set -euo pipefail
                    for attempt in {1..30}; do
                      status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$(apiReadyUrl)")"
                      if test "$status" = "200"; then exit 0; fi
                      echo "API readiness check returned HTTP $status; retrying..."
                      sleep 10
                    done
                    exit 1
                  displayName: Verify API readiness
